// The Kanban studio is plain JavaScript — no Angular port yet. These are
// the same dashboard() options in the Angular component; the Kanban board
// demo's Angular tab is a complete, running Angular port of a smaller board.
import { Component } from '@angular/core';
import { GrafloriaDashboardComponent, GrafloriaWidgetDefDirective } from '@grafloria/angular';
import type { DashboardHandle, DashboardOptions, DashboardWidgetSpec } from '@grafloria/element';

// One list: a section that only trades places with other lists.
const list = (id: string, title: string, cards: DashboardWidgetSpec[]): DashboardWidgetSpec => ({
  id, title, span: 1, rows: 12, columns: 1, maxRows: 1,
  pinned: true, movable: 'row', resizable: false, stack: true,
  background: 'var(--ks-list)',
  caption: { text: title, height: 60, background: 'transparent', border: 'none' },
  footer: { height: 48 },              // painted by options.renderFooter
  widgets: cards,                      // cards: { kind: 'card', autoHeight: true, data }
});
const options: DashboardOptions = {
  columns: 5, sizing: 'grow', rowHeight: 8, float: false, autoHeight: true,
  canDrop: ({ to }) => !atWipLimit(to),   // refuse a full list
  renderFooter: (w, host) => { host.innerHTML = '<button data-axdb-pass>+ Add a card</button>'; },
};

@Component({
  selector: 'kanban-studio',
  imports: [GrafloriaDashboardComponent, GrafloriaWidgetDefDirective],
  template: `
    <grafloria-dashboard [widgets]="lists" [options]="options" (ready)="onReady($event)">
      <ng-template grafloriaWidget="card" let-data="data">
        <div class="ks-card">{{ data['title'] }}</div>
      </ng-template>
    </grafloria-dashboard>`,
})
export class KanbanStudio {
  lists = LISTS.map((l) => list(l.id, l.name, l.cards));
  options = options;
  onReady(h: DashboardHandle) { /* h.addWidget(list(...)) adds a list */ }
}
</script>

<script type="module">
import { render, dashboard } from '../shell/grafloria.js';
import { defineDemo, check, checkEqual } from '../shell/demo.js?v=drawer4';
import * as DATA from './kanban-studio-data.js';
import { paintCard, matches, el, icon } from './kanban-studio-card.js';
import { openCardDialog } from './kanban-studio-dialog.js';
import { buildChrome } from './kanban-studio-chrome.js';

/* ================================================================================
   KANBAN STUDIO — a full team board on the dashboard kit. Lists are sections with
   `movable: 'row'` (they only trade places), `stack` (a drop lands after the last
   card), a `background` tint and a `footer` band ("+ Add a card"); new lists come
   from addWidget({ widgets: [] }); cards are `autoHeight` widgets; `canDrop` holds
   the WIP limits. The page paints and wires; the board's behaviour is the kit's.
   Helpers: kanban-studio-{data,art,card,dialog,chrome}.js, styles in kanban-studio.css.
   ================================================================================ */
const { LABELS, MEMBERS, ME, CARDS, BACKDROPS } = DATA;
const ROW = 4, GAP = 8;               // a small row unit: a card rounds up by at most 12 px
const UNIT = ROW + GAP;               // one parent row, px
const HEAD_ROWS = 5, FOOT_ROWS = 4;   // the list header (48 px of title + 12 px above the first card) and its "+ Add a card" footer (48 px)
const LIST_W = 272;                   // a list, px
const MAX_LISTS = 8;                  // the board has room for this many lists
const GUESS = 8;                      // a card's first-guess rows; autoHeight measures it
const ctx = { labels: LABELS, members: MEMBERS, me: ME };
const stage = document.getElementById('stage');

let H, api, chrome, seq = 0, listSeq = 0;
const names = new Map(DATA.LISTS.map((l) => [l.id, l.name]));
const wips = new Map(DATA.LISTS.filter((l) => l.wip).map((l) => [l.id, l.wip]));
const cardSpec = (d) => ({ id: `c${++seq}`, kind: 'card', span: 1, rows: GUESS, resizable: false, data: structuredClone(d) });
const listSpec = (id, title, cards) => ({
  id, title, span: 1, rows: Math.max(1, cards.length * GUESS) + HEAD_ROWS + FOOT_ROWS, columns: 1, maxRows: 1,
  pinned: true, movable: 'row', resizable: false, stack: true, background: 'var(--ks-list)',
  caption: { text: title, height: HEAD_ROWS * UNIT, background: 'transparent', border: 'none' },
  footer: { height: FOOT_ROWS * UNIT },
  widgets: cards.map(cardSpec),
});
const dataOf = (id) => H.widget(id)?.spec.data;

/* ---- reading the board ------------------------------------------------------------- */
const view = () => H.toJSON().views[0];
/** The lists, left to right, as the board holds them now. */
const lists = () => view().widgets.filter((w) => w.widgets).sort((a, b) => a.x - b.x).map((w) => ({ id: w.id, name: names.get(w.id) ?? w.title, wip: wips.get(w.id) }));
const cardsIn = (listId) => (view().widgets.find((w) => w.id === listId)?.widgets ?? []).filter((w) => !w.data?.draft).map((w) => w.id);
const listOfCard = (id) => lists().find((l) => cardsIn(l.id).includes(id))?.id;
const isFull = (listId) => { const w = wips.get(listId); return !!w && cardsIn(listId).length >= w; };

/* ---- activity ------------------------------------------------------------------------ */
const activity = DATA.ACTIVITY.map((a) => ({ ...a }));
function log(text, cardId, who = ME) {
  activity.unshift({ who, at: 0, text });
  if (cardId) { const d = dataOf(cardId); if (d) (d.activity ??= []).push({ who, at: 0, text }); }
  chrome?.refreshActivity();
}
/** Where every card was after the last change — a diff names what moved. */
let lastPlaces = new Map();
let lastOrder = '';
function noteMoves() {
  const now = new Map();
  for (const l of lists()) for (const id of cardsIn(l.id)) now.set(id, l.id);
  for (const [id, to] of now) {
    const from = lastPlaces.get(id);
    if (from && from !== to) log(`moved ${dataOf(id)?.title} from ${names.get(from)} to ${names.get(to)}`, id);
  }
  const order = lists().map((l) => l.id).join(',');
  if (lastOrder && order !== lastOrder) {
    const before = lastOrder.split(','), after = order.split(',');
    if (before.length === after.length) {
      const moved = after.find((id, i) => before[i] !== id && after.indexOf(id) - before.indexOf(id) !== 0 && before[i + 1] !== id) ?? after.find((id, i) => before[i] !== id);
      if (moved) log(`moved list ${names.get(moved)} to position ${after.indexOf(moved) + 1}`);
    }
  }
  lastPlaces = now;
  lastOrder = order;
}

/* ---- the drop policy, headers, footers ----------------------------------------------- */
let lastRefusal = 0;
function canDrop({ to }) {
  if (!lists().some((l) => l.id === to)) return false;               // cards live in lists
  if (!isFull(to)) return true;
  if (Date.now() - lastRefusal > 1500) { lastRefusal = Date.now(); toast(`${names.get(to)} has a limit of ${wips.get(to)} cards — finish one first`); }
  return false;
}
const heads = new Map();   // listId → { host, count, menu }
function paintHead(listId, host) {
  const head = el('div', 'ks-head');
  // Not a <button>: a caption's buttons are content and never start a drag. A
  // click (or Enter) renames; a press-and-drag moves the list, as the whole header does.
  const name = el('span', 'ks-hname', names.get(listId));
  name.setAttribute('role', 'button');
  name.tabIndex = 0;
  name.title = 'Rename this list';
  name.addEventListener('click', (e) => { e.stopPropagation(); renameList(listId, host); });
  name.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); renameList(listId, host); } });
  const count = el('span', 'ks-count');
  const menuBtn = el('button', 'ks-hbtn');
  menuBtn.type = 'button';
  menuBtn.dataset.axdbPass = '';
  menuBtn.title = 'List actions';
  menuBtn.setAttribute('aria-label', 'List actions');
  menuBtn.append(icon('dots', 16));
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); listMenu(listId, menuBtn); });
  head.append(name, count, menuBtn);
  host.replaceChildren(head);
  heads.set(listId, { host, count, menu: menuBtn });
  if (H) refreshCounts();
}
function renameList(listId, host) {
  const input = el('input', 'ks-hname-input');
  input.value = names.get(listId);
  input.setAttribute('aria-label', 'List name');
  input.dataset.axdbPass = '';
  host.querySelector('.ks-hname').replaceWith(input);
  input.focus(); input.select();
  let ended = false;
  const end = (save) => {
    if (ended) return;
    ended = true;
    const v = input.value.trim();
    if (save && v && v !== names.get(listId)) { log(`renamed list ${names.get(listId)} to ${v}`); names.set(listId, v); }
    paintHead(listId, host);
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') end(true); if (e.key === 'Escape') { e.stopPropagation(); end(false); } });
  input.addEventListener('blur', () => end(true));
}
const feet = new Map();   // listId → host
function paintFoot(listId, host) {
  if (!host) return;
  feet.set(listId, host);
  host.replaceChildren();
  const band = el('div', 'ks-foot-band');
  if (draft && draft.listId === listId) {
    const add = el('button', 'ks-compose-add', 'Add card');
    add.type = 'button';
    add.addEventListener('pointerdown', (e) => e.preventDefault());   // keep the composer's focus
    add.addEventListener('click', () => commitDraft());
    const x = el('button', 'ks-compose-x');
    x.type = 'button';
    x.title = 'Cancel';
    x.setAttribute('aria-label', 'Cancel');
    x.append(icon('close', 16));
    x.addEventListener('pointerdown', (e) => e.preventDefault());
    x.addEventListener('click', () => cancelDraft());
    band.append(add, x);
  } else {
    const add = el('button', 'ks-addcard');
    add.type = 'button';
    add.append(icon('plus', 16), el('span', '', 'Add a card'));
    add.hidden = !!H && isFull(listId);   // the kit paints footers while the board is still being built
    add.title = `Add a card to ${names.get(listId)}`;
    add.addEventListener('click', () => startDraft(listId));
    band.append(add);
  }
  host.append(band);
}
function refreshCounts() {
  if (!H) return;
  for (const l of lists()) {
    const h = heads.get(l.id);
    if (h) {
      const n = cardsIn(l.id).length;
      h.count.textContent = l.wip ? `${n} / ${l.wip}` : '';
      h.count.title = l.wip ? `Work-in-progress limit: ${l.wip}` : '';
      h.count.classList.toggle('ks-full', !!l.wip && n >= l.wip);
    }
    if (!(draft && draft.listId === l.id)) paintFoot(l.id, feet.get(l.id));
  }
  placeAddList();
  applyFilter();
}

/* ---- list actions ------------------------------------------------------------------- */
function listMenu(listId, anchor) {
  stage.querySelector('.ks-menu')?.remove();
  const m = el('div', 'ks-menu');
  m.style.width = '304px';
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-label', 'List actions');
  const head = el('div', 'ks-pop-head');
  const x = el('button', 'ks-pop-x'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.append(icon('close'));
  head.append(el('span', '', 'List actions'), x);
  const body = el('div', 'ks-pop-body');
  const item = (text, fn) => { const b = el('button', 'ks-drawer-item', text); b.type = 'button'; b.addEventListener('click', () => { close(); fn(); }); body.append(b); return b; };
  item('Add card', () => startDraft(listId));
  body.append(el('h5', '', 'Work-in-progress limit'));
  const limit = el('form', 'ks-row');
  const n = el('input', 'ks-field');
  n.type = 'number'; n.min = '0'; n.max = '50'; n.id = 'ks-wip-input';
  n.value = String(wips.get(listId) ?? '');
  n.placeholder = 'No limit';
  n.setAttribute('aria-label', 'Most cards this list takes');
  const set = el('button', 'ks-btn', 'Set'); set.type = 'submit';
  limit.append(n, set);
  limit.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = Number(n.value);
    if (v > 0) wips.set(listId, v); else wips.delete(listId);
    log(v > 0 ? `set a limit of ${v} cards on ${names.get(listId)}` : `removed the limit on ${names.get(listId)}`);
    close(); refreshCounts();
  });
  body.append(limit);
  const arch = item('Archive this list', () => {
    const name = names.get(listId);
    H.widget(listId)?.remove();
    log(`archived list ${name}`);
    setTimeout(refreshCounts, 0);
    toast(`List archived: ${name}`, 'Undo', undo);
  });
  arch.id = 'ks-archive-list';
  m.append(head, body);
  stage.append(m);
  const a = anchor.getBoundingClientRect(), s = stage.getBoundingClientRect();
  m.style.left = `${Math.max(8, Math.min(a.left - s.left, s.width - 312))}px`;
  m.style.top = `${a.bottom - s.top + 6}px`;
  anchor.setAttribute('aria-expanded', 'true');
  const close = () => { m.remove(); anchor.setAttribute('aria-expanded', 'false'); document.removeEventListener('pointerdown', outside, true); };
  const outside = (e) => { if (!m.contains(e.target) && !anchor.contains(e.target)) close(); };
  x.addEventListener('click', close);
  setTimeout(() => document.addEventListener('pointerdown', outside, true));
}

/* ---- "+ Add another list" ----------------------------------------------------------------- */
const addList = el('div', 'ks-addlist');
function placeAddList() {
  const n = lists().length;
  addList.hidden = n >= MAX_LISTS;
  addList.style.left = `${GAP + n * (LIST_W + GAP)}px`;
}
function paintAddList(open) {
  addList.replaceChildren();
  if (!open) {
    const b = el('button');
    b.type = 'button';
    b.id = 'ks-addlist-open';
    b.append(icon('plus', 16), el('span', '', lists().length ? 'Add another list' : 'Add a list'));
    b.addEventListener('click', () => paintAddList(true));
    addList.append(b);
    return;
  }
  const form = el('form');
  const input = el('input');
  input.id = 'ks-addlist-name';
  input.placeholder = 'Enter list name…';
  input.setAttribute('aria-label', 'List name');
  const row = el('div', 'ks-row');
  const add = el('button', 'ks-compose-add', 'Add list'); add.type = 'submit';
  const x = el('button', 'ks-compose-x'); x.type = 'button'; x.setAttribute('aria-label', 'Cancel'); x.append(icon('close', 16));
  x.addEventListener('click', () => paintAddList(false));
  row.append(add, x);
  form.append(input, row);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return input.focus();
    const id = `list-${++listSeq}`;
    names.set(id, name);
    const w = H.addWidget({ ...listSpec(id, name, []), x: lists().length, y: 0 });
    if (w) { log(`added list ${name} to this board`); placeAddList(); paintAddList(true); }
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); paintAddList(false); } });
  addList.append(form);
  input.focus();
}

/* ---- the composer: a draft card at the end of a list ---------------------------------------- */
let draft = null;   // { listId, id, at: the history index before its add }
function startDraft(listId) {
  if (draft) finishDraft();
  if (isFull(listId)) { toast(`${names.get(listId)} has a limit of ${wips.get(listId)} cards`); return; }
  const at = cmd().currentIndex;
  const w = H.addWidget(cardSpec({ draft: true, title: '' }), listId);
  if (!w) return;
  draft = { listId, id: w.id, at };
  paintFoot(listId, feet.get(listId));
  requestAnimationFrame(() => requestAnimationFrame(() => focusDraft()));
}
function focusDraft() {
  const ta = draft && document.querySelector(`.grafloria-node-host[data-node-id="${draft.id}"] .ks-draft`);
  if (!ta) return;
  ta.focus();
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = `${ta.scrollHeight}px`; };
  ta.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commitDraft(); }
    if (e.key === 'Escape') { e.stopPropagation(); cancelDraft(); }
  };
  ta.onblur = () => setTimeout(() => { if (draft && document.activeElement !== ta) finishDraft(); }, 150);
}
function draftText() { return document.querySelector(`.grafloria-node-host[data-node-id="${draft?.id}"] .ks-draft`)?.value.trim() ?? ''; }
/** Enter / "Add card": the draft becomes a card, and a fresh draft opens under it. */
function commitDraft() {
  if (!draft) return;
  const title = draftText();
  if (!title) return focusDraft();
  const { listId, id } = draft;
  H.widget(id)?.update({ data: { title, labels: [], members: [], activity: [{ who: ME, at: 0, text: `added this card to ${names.get(listId)}` }] } });
  log(`added ${title} to ${names.get(listId)}`);
  draft = null;
  refreshCounts();
  startDraft(listId);
}
/** Blur: a draft with text is kept, an empty one goes. */
function finishDraft() { if (draftText()) commitDraft(); else cancelDraft(); }
/** × / Esc: the empty draft goes without a trace — its add is undone, not answered with a remove. */
function cancelDraft() {
  if (!draft) return;
  const { listId, id, at } = draft;
  draft = null;
  const cm = cmd();
  // Nothing happened since the draft's add (typing is not a step): undo it, so
  // the history never holds a card that only ever was a draft.
  if (cm.currentIndex === at + 1) cm.undo(); else H.widget(id)?.remove();
  paintFoot(listId, feet.get(listId));
  setTimeout(() => { refreshCounts(); syncUndo(); }, 0);
}

/* ---- filters --------------------------------------------------------------------------------- */
const filter = { labels: new Set(), members: new Set(), due: new Set(), text: '' };
function applyFilter() {
  if (!H) return;
  const on = filter.labels.size || filter.members.size || filter.due.size || filter.text;
  let shown = 0, total = 0;
  for (const l of lists()) for (const id of cardsIn(l.id)) {
    total++;
    const ok = !on || matches(dataOf(id), filter);
    if (ok) shown++;
    document.querySelector(`.grafloria-node-host[data-node-id="${id}"]`)?.classList.toggle('ks-dim', !ok);
  }
  chrome?.setMatch(on ? `${shown} of ${total} cards` : '');
}

/* ---- cards: one delegated listener for the face's controls; a click opens the card ------------ */
let dialog = null;
function updateCard(id, next) { H.widget(id)?.update({ data: next }); applyFilter(); }
function openCard(id) {
  const d = dataOf(id);
  if (!d || d.draft) return;
  dialog?.close();
  dialog = openCardDialog(stage, {
    card: d, cardId: id, listId: listOfCard(id), lists: lists(), ctx,
    onChange: (next) => updateCard(id, next),
    onArchive: () => { const t = dataOf(id)?.title; H.widget(id)?.remove(); log(`archived ${t}`); setTimeout(refreshCounts, 0); toast(`Card archived: ${t}`, 'Undo', undo); },
    onCopy: (copy) => {
      const to = listOfCard(id);
      if (isFull(to)) return toast(`${names.get(to)} has a limit of ${wips.get(to)} cards`);
      const w = H.addWidget(cardSpec({ ...copy, title: `${copy.title} (copy)`, comments: undefined, activity: [] }), to);
      if (w) { log(`copied ${copy.title} in ${names.get(to)}`); toast('Card copied'); setTimeout(refreshCounts, 0); }
    },
    onMove: (to) => moveCard(id, to),
    log: (text) => log(text, id),
    onClose: () => { dialog = null; },
  });
}
/** "Move" from the dialog: the card leaves one list and joins the end of another. */
function moveCard(id, to) {
  if (isFull(to)) return toast(`${names.get(to)} has a limit of ${wips.get(to)} cards`);
  const d = structuredClone(dataOf(id));
  const from = listOfCard(id);
  H.widget(id)?.remove();
  const w = H.addWidget({ id, kind: 'card', span: 1, rows: GUESS, resizable: false, data: d }, to);
  if (w) log(`moved ${d.title} from ${names.get(from)} to ${names.get(to)}`, id);
  setTimeout(refreshCounts, 0);
}
const canvas = document.getElementById('canvas');
canvas.addEventListener('click', (e) => {
  const actEl = e.target.closest?.('[data-act]');
  const host = e.target.closest?.('.grafloria-node-host');
  if (!actEl || !host) return;
  e.stopPropagation();
  const id = host.dataset.nodeId;
  const d = structuredClone(dataOf(id));
  switch (actEl.dataset.act) {
    case 'complete':
      d.complete = !d.complete;
      updateCard(id, d);
      log(`marked ${d.title} as ${d.complete ? 'complete' : 'incomplete'}`, id);
      break;
    case 'due':
      d.due.done = !d.due.done;
      updateCard(id, d);
      log(`marked the due date on ${d.title} ${d.due.done ? 'complete' : 'incomplete'}`, id);
      break;
    case 'labels':
      stage.classList.toggle('ks-labels-min');
      H.refresh();   // every label row changed height: autoHeight measures each card again
      break;
    case 'open':
      openCard(id);
      break;
  }
});
let press = null;
canvas.addEventListener('pointerdown', (e) => {
  const host = e.target.closest?.('.grafloria-node-host');
  press = host && e.target.closest('[data-card]') && !e.target.closest('[data-act], textarea') ? { id: host.dataset.nodeId, x: e.clientX, y: e.clientY } : null;
}, true);
window.addEventListener('pointerup', (e) => {
  const p = press; press = null;
  if (p && Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y) < 5) openCard(p.id);
}, true);

/* ---- drag the backdrop to scroll the board --------------------------------------------------- */
const scroller = document.getElementById('ks-scroll');
scroller.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || e.target.closest('.grafloria-node-host, .axdb-slab, .ks-addlist, button, input, textarea, select')) return;
  const overList = [...stage.querySelectorAll('.axdb-slab[data-slab-id]')].some((s) => { const r = s.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; });
  if (overList) return;
  // A press on the empty board is still a click on nothing: the selection clears, as anywhere else.
  H?.selectWidget(undefined);
  api?.getModel().clearSelection?.();
  e.preventDefault(); e.stopPropagation();
  const x0 = e.clientX, left0 = scroller.scrollLeft;
  scroller.classList.add('ks-panning');
  const move = (ev) => { scroller.scrollLeft = left0 - (ev.clientX - x0); };
  const up = () => { scroller.classList.remove('ks-panning'); window.removeEventListener('pointermove', move, true); window.removeEventListener('pointerup', up, true); };
  window.addEventListener('pointermove', move, true);
  window.addEventListener('pointerup', up, true);
}, true);

/* ---- undo, toast, backdrops, keyboard --------------------------------------------------------- */
const cmd = () => api.getEngine().commandManager;
async function undo() { if (cmd().canUndo()) { await cmd().undo(); refreshCounts(); } syncUndo(); }
async function redo() { if (cmd().canRedo()) { await cmd().redo(); refreshCounts(); } syncUndo(); }
const syncUndo = () => chrome?.syncUndo(cmd().canUndo(), cmd().canRedo());
let toastTimer = 0;
function toast(text, action, fn) {
  stage.querySelector('.ks-toast')?.remove();
  const t = el('div', 'ks-toast');
  t.setAttribute('role', 'status');
  t.append(el('span', '', text));
  if (action) { const b = el('button', '', action); b.type = 'button'; b.addEventListener('click', () => { fn(); t.remove(); }); t.append(b); }
  stage.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 5000);
}
let backdrop = 'dusk';
function setBackdrop(key) {
  const b = BACKDROPS.find((x) => x.key === key) ?? BACKDROPS[0];
  backdrop = b.key;
  stage.dataset.backdrop = b.key;
  stage.style.backgroundImage = b.image ? `url(${b.image})` : 'none';
  stage.style.backgroundColor = b.color ?? '#3b2a63';
  try { localStorage.setItem('ks-backdrop', b.key); } catch { /* fine without */ }
}
window.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || stage.querySelector('.ks-shade')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); (e.shiftKey ? redo : undo)(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'f') { e.preventDefault(); chrome.openFilter(); }
  else if (e.key === 'q') { filter.members.has(ME) ? filter.members.delete(ME) : filter.members.add(ME); applyFilter(); chrome.syncFilterBtn(); }
  else if (e.key === 'x') { filter.labels.clear(); filter.members.clear(); filter.due.clear(); filter.text = ''; applyFilter(); chrome.syncFilterBtn(); }
  else if (e.key === '?') { chrome.shortcuts(); }
});

/* ---- the board -------------------------------------------------------------------------------- */
function buildSpec() {
  return dashboard({
    columns: MAX_LISTS,
    gap: GAP,
    sizing: 'grow',
    rowHeight: ROW,
    float: false,
    autoHeight: true,
    canDrop,
    widgets: DATA.LISTS.map((l) => listSpec(l.id, l.name, CARDS[l.id])),
    renderWidget: (w, host) => { if (w.kind === 'card') paintCard(host, w.data, ctx); },
    renderCaption: (w, host) => paintHead(w.id, host),
    renderFooter: (w, host) => paintFoot(w.id, host),
    onLayoutChange: () => {
      refreshCounts();
      syncUndo();
      try { noteMoves(); } catch (e) { console.error('noteMoves', e); }
    },
  });
}

defineDemo({
  name: 'Kanban studio',
  blurb: 'A full team board built from dashboard() options. Lists are sections that only trade places (movable: \'row\'), keep their cards in order (stack), carry a frosted tint (background) and an "Add a card" footer; new lists come from addWidget. Cards are autoHeight widgets with covers, labels, due dates, checklists and people; canDrop holds the work-in-progress limits. Click a card for the full editor — description, checklist, attachments, comments, cover, move, copy, archive — and it resizes as you go.',
  howTo: [
    'Drag a card to another list — it tilts in your hand and the list it will land in is ringed. "In progress" holds 4 and "In review" 3: a full list rings red, refuses the card and says why.',
    'Drag a list by its header to reorder the lists. Click a list\'s name to rename it; its ⋯ menu sets a limit or archives it. "Add another list" adds one.',
    'Press "Add a card" at the bottom of a list, type a title and press Enter — the composer stays open for the next card. Esc closes it.',
    'Click a card to open it: add checklist items, comments, attachments, a cover or a due date; move, copy or archive it. Hover a card for its complete circle and the quick-edit pencil; click a label to collapse every label to a bar.',
    'Filter from the Filters button (or press F; Q shows only your cards), search from the app bar, change the background from the ⋯ menu, and drag the empty backdrop to scroll. Ctrl+Z undoes.',
  ],

  async setup(c) {
    chrome = buildChrome(document.getElementById('ks-appbar'), document.getElementById('ks-boardbar'), {
      stage, data: DATA, filter,
      onFilter: applyFilter, onBackdrop: setBackdrop, onUndo: undo, onRedo: redo,
      activity: () => activity, backdropKey: () => backdrop,
    });
    let saved = 'dusk';
    try { saved = localStorage.getItem('ks-backdrop') || 'dusk'; } catch { /* storage may be blocked */ }
    setBackdrop(saved);
    canvas.style.width = `${MAX_LISTS * (LIST_W + GAP) + GAP}px`;
    document.getElementById('ks-board').style.width = canvas.style.width;
    document.getElementById('ks-board').append(addList);
    const spec = buildSpec();
    api = render(spec, c.host);
    H = spec.handle;
    c.instance = api; c.diagram = api.getModel(); c.handle = H;
    window.__lab = { H, api, D: c.diagram };   // the e2e probes read the live board
    api.renderNow();
    await c.tick();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    paintAddList(false);
    noteMoves();
    refreshCounts();
    syncUndo();
  },

  async assert(c) {
    const D = c.diagram;
    const container = c.host;
    const settle = async () => { c.instance.renderNow(); await c.tick(); };
    const raf = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const frames = async (n = 4) => { for (let i = 0; i < n; i++) await raf(); await settle(); };
    const toClient = (wx, wy) => c.instance.viewport.worldToClient(wx, wy, container.getBoundingClientRect());
    let PID = 70;
    const pev = (type, cx, cy) => (document.elementFromPoint(cx, cy) ?? container).dispatchEvent(new PointerEvent(type, {
      clientX: cx, clientY: cy, bubbles: true, cancelable: true, composed: true,
      pointerId: PID, pointerType: 'mouse', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1,
    }));
    const hold = async (from, to, steps = 14) => {
      PID++;
      const a = toClient(from.x, from.y); pev('pointerdown', a.x, a.y);
      for (let i = 1; i <= steps; i++) { const p = toClient(from.x + ((to.x - from.x) * i) / steps, from.y + ((to.y - from.y) * i) / steps); pev('pointermove', p.x, p.y); await raf(); }
      return async () => { const p = toClient(to.x, to.y); pev('pointerup', p.x, p.y); await settle(); };
    };
    const grab = (n) => ({ x: n.position.x + n.size.width / 2, y: n.position.y + Math.min(n.size.height / 2, 30) });
    const order = (list) => [...D.getGroup(list).members].map((id) => D.getNode(id)).filter(Boolean).sort((a, b) => a.position.y - b.position.y).map((n) => n.id);
    const ring = (id) => { const e = container.querySelector(`.axdb-slab[data-slab-id="${id}"]`); return e?.classList.contains('axdb-slab--refused') ? 'refused' : e?.classList.contains('axdb-slab--drop') ? 'drop' : 'none'; };
    const clipped = () => [...container.querySelectorAll('.grafloria-node-host .ks-card')].filter((e) => e.offsetHeight > e.parentElement.clientHeight + 1).length;
    const listOrder = () => lists().map((l) => l.id).join(',');
    const hostOf = (id) => container.querySelector(`.grafloria-node-host[data-node-id="${id}"]`);
    const clickCard = async (id) => { const r = hostOf(id).querySelector('.ks-title').getBoundingClientRect(); PID++; pev('pointerdown', r.x + 6, r.y + 6); pev('pointerup', r.x + 6, r.y + 6); await settle(); };
    const footBtn = (list) => container.querySelector(`.axdb-slab[data-slab-id="${list}"] .ks-addcard`);
    const overFoot = (list) => { const g = D.getGroup(list); return { x: g.position.x + g.size.width / 2, y: g.position.y + g.size.height - 16 }; };
    await settle();

    // ① the board
    checkEqual(listOrder(), 'backlog,todo,doing,review,done', 'five lists, in order');
    checkEqual(lists().reduce((n, l) => n + cardsIn(l.id).length, 0), 15, 'fifteen cards');
    checkEqual(clipped(), 0, 'no card is cut off');
    check(lists().every((l) => footBtn(l.id)), 'every list ends in "Add a card"');
    const doingG = D.getGroup('doing');
    const lastDoing = D.getNode(order('doing').at(-1));
    check(doingG.position.y + doingG.size.height - (lastDoing.position.y + lastDoing.size.height) <= FOOT_ROWS * UNIT + UNIT, 'lists hug their cards: the footer sits right under the last one');
    check(getComputedStyle(stage).backgroundImage.includes('kanban-studio-backdrop.svg'), 'the dusk backdrop is on');
    check(!!container.querySelector('.ks-card--full'), 'a full-cover card is on the board');
    check(!!document.getElementById('ks-addlist-open'), '"Add another list" sits after the last list');

    // ② filters fade what does not match, and never move anything
    const pos0 = JSON.stringify(cardsIn('doing').map((id) => D.getNode(id).position));
    document.getElementById('ks-filter-btn').click();
    stage.querySelector('.ks-menu input[data-filter="bug"]').click();
    checkEqual(container.querySelectorAll('.grafloria-node-host.ks-dim').length, 13, 'the Bug filter fades the 13 cards without that label');
    checkEqual(JSON.stringify(cardsIn('doing').map((id) => D.getNode(id).position)), pos0, 'and nothing moved');
    stage.querySelector('.ks-menu input[data-filter="bug"]').click();
    const kw = stage.querySelector('#ks-filter-text');
    kw.value = 'page'; kw.dispatchEvent(new Event('input'));
    checkEqual(document.getElementById('ks-match').textContent, '2 of 15 cards', 'the keyword "page" matches two cards');
    stage.querySelector('.ks-clear').click();
    checkEqual(container.querySelectorAll('.grafloria-node-host.ks-dim').length, 0, '"Clear all" shows every card');

    // ③ labels collapse to bars, and every card measures again
    const labelled = cardsIn('todo')[0];
    const hLab = D.getNode(labelled).size.height;
    hostOf(labelled).querySelector('.ks-label').click();
    await frames();
    check(stage.classList.contains('ks-labels-min'), 'a click on a label collapses every label');
    checkEqual(hostOf(labelled).querySelector('.ks-label').getBoundingClientRect().height, 8, 'labels are now 8 px bars');
    check(D.getNode(labelled).size.height <= hLab, 'and no card got taller (autoHeight measured again)');
    checkEqual(clipped(), 0, 'nothing is cut off with bars');
    hostOf(labelled).querySelector('.ks-label').click();
    await frames();
    checkEqual(D.getNode(labelled).size.height, hLab, 'a second click brings the names back');

    // ④ the complete circle
    const c1 = cardsIn('backlog')[1];
    hostOf(c1).querySelector('.ks-done').click();
    check(!!hostOf(c1).querySelector('.ks-card--complete'), 'the circle marks a card complete');
    hostOf(c1).querySelector('.ks-done').click();

    // ⑤ the card dialog: checklist, title, comment — the card follows
    const target = cardsIn('backlog')[1];                 // "Pricing page A/B test plan"
    const h0 = D.getNode(target).size.height;
    await clickCard(target);
    check(!!stage.querySelector('.ks-dialog'), 'clicking a card opens it');
    [...stage.querySelectorAll('.ks-sidebtn')].find((b) => b.textContent === 'Checklist').click();
    await raf();
    for (const t of ['Write the hypothesis', 'Pick the metric', 'Set the sample size']) {
      const input = stage.querySelector('#ks-dlg-add-item');
      input.value = t; input.closest('form').requestSubmit(); await raf();
    }
    stage.querySelector('#ks-item-0').click();
    const title = stage.querySelector('#ks-dlg-title');
    title.value = 'Pricing page A/B test plan: monthly-first against annual-first, two full weeks, decided on paid conversions';
    title.dispatchEvent(new Event('change'));
    stage.querySelector('#ks-dlg-comment-open').click();
    await raf();
    stage.querySelector('#ks-dlg-comment').value = 'Starting Monday.';
    stage.querySelector('.ks-cmt-form .ks-btn').click();
    check([...stage.querySelectorAll('.ks-feed-text')].some((e) => e.textContent === 'Starting Monday.'), 'the comment is in the activity feed');
    stage.querySelector('.ks-dlg-x').click();
    await frames();
    check(!stage.querySelector('.ks-dialog'), 'the close button closes it');
    checkEqual(hostOf(target).querySelector('.ks-check')?.textContent, '1/3', 'the card shows its checklist, 1 of 3 done');
    checkEqual(hostOf(target).querySelector('.ks-badge[title$="comments"]')?.textContent, '1', 'and one comment');
    check(D.getNode(target).size.height > h0 + 20, 'and grew to fit its longer title (autoHeight)');
    checkEqual(clipped(), 0, 'still nothing cut off');

    // ⑥ the composer
    const doneBefore = cardsIn('done').length;
    footBtn('done').click();
    await frames();
    const ta = container.querySelector('.ks-draft');
    check(!!ta && document.activeElement === ta, '"Add a card" opens a focused composer at the end of Done');
    ta.value = 'Ship the launch email';
    ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await frames();
    checkEqual(cardsIn('done').length, doneBefore + 1, 'Enter adds the card');
    check([...container.querySelectorAll('.ks-title')].some((e) => e.textContent === 'Ship the launch email'), 'with its title');
    const ta2 = container.querySelector('.ks-draft');
    check(!!ta2, 'and the composer stays open for the next card');
    ta2.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await frames();
    check(!container.querySelector('.ks-draft'), 'Esc closes the empty composer');
    await undo();
    checkEqual(cardsIn('done').length, doneBefore, 'one undo takes the new card back — the closed composer left no step');

    // ⑦ moving cards: a card dropped over a list's footer lands at its end; a full list refuses
    const mover = cardsIn('todo')[0];
    const release = await hold(grab(D.getNode(mover)), overFoot('doing'));
    checkEqual(ring('doing'), 'drop', 'mid-drag, In progress is ringed');
    check(!!container.querySelector('.grafloria-node-host.axdb-ghost'), 'and the card in the hand is the tilted ghost');
    await release();
    await frames();
    check(D.getGroup('doing').members.has(mover), 'the card moved into In progress');
    checkEqual(order('doing').at(-1), mover, 'dropped on the footer, it landed at the end');
    checkEqual(heads.get('doing').count.textContent, '4 / 4', 'In progress is now at its limit');
    check(activity[0].text.startsWith('moved ') && activity[0].text.endsWith('to In progress'), 'the move is in the activity log');
    const extra = cardsIn('todo')[0];
    const release2 = await hold(grab(D.getNode(extra)), overFoot('doing'));

    check(D.getGroup('todo').members.has(extra), 'and goes back to To do');
    check(!!stage.querySelector('.ks-toast'), 'the board says why');
    await undo();
    check(D.getGroup('todo').members.has(mover), 'Undo puts the move back');

    // ⑧ lists only trade places

    // ⑨ "Add another list"

    // ⑩ the board menu: background

    stage.querySelector('.ks-bg[data-backdrop="dusk"]').click();
    chrome.toggleDrawer(false);
  },

  async showcase(c) {
    // The money shot: a card mid-drag toward In progress, tilted in the hand.
    const D = c.diagram;
    const container = c.host;
    const toClient = (wx, wy) => c.instance.viewport.worldToClient(wx, wy, container.getBoundingClientRect());
    const pev = (type, cx, cy) => (document.elementFromPoint(cx, cy) ?? container).dispatchEvent(new PointerEvent(type, {
      clientX: cx, clientY: cy, bubbles: true, cancelable: true, composed: true, pointerId: 99, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 1,
    }));
    const card = D.getNode(cardsIn('todo')[0]);

    const from = { x: card.position.x + card.size.width / 2, y: card.position.y + 24 };
    const to = { x: doing.position.x + doing.size.width / 2 + 36, y: doing.position.y + doing.size.height - 40 };
    const a = toClient(from.x, from.y); pev('pointerdown', a.x, a.y);
    for (let i = 1; i <= 12; i++) { const p = toClient(from.x + ((to.x - from.x) * i) / 12, from.y + ((to.y - from.y) * i) / 12); pev('pointermove', p.x, p.y); await c.tick(16); }
    c.instance.renderNow();
  },
});
</script>
