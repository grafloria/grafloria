<div id="canvas"></div>
<script type="module">
import { render, SwimlaneService, layoutPool } from '../shell/grafloria.js';
import { defineDemo, check } from '../shell/demo.js?v=drawer4';

// A cross-functional process: a POOL whose LANES are the people (or systems)
// doing the work. A step belongs to the lane it sits in; connections cross
// lanes. Everything a hand does to the pool — a step to another lane, a lane
// border, a lane's place, a fold, a layout — is one step on the engine's undo
// stack, because the SwimlaneService is given the engine's command manager.

// The Warehouse is split into two SUB-LANES: Picking and Dispatch.
const LANES = [{ name: 'Customer' }, { name: 'Finance' }, { name: 'Sales' }, { name: 'Warehouse', subs: ['Picking', 'Dispatch'] }];
const TOP = LANES.map((l) => l.name);
// Three PHASES run across every lane; each step sits in one.
const PHASES = [{ id: 'order', name: 'Order' }, { id: 'fulfil', name: 'Fulfil' }, { id: 'bill', name: 'Bill' }];
const STEP = { width: 150, height: 50 };
const EVENT = { width: 120, height: 46 };
const GATE = { width: 140, height: 88 };
const STEPS = [
  { id: 'placed', label: 'Ordered', lane: 'Customer', phase: 'order', size: EVENT, shape: { type: 'terminal' } },
  { id: 'confirm', label: 'Confirm order', lane: 'Sales', phase: 'order' },
  { id: 'credit', label: 'Check credit', lane: 'Finance', phase: 'order' },
  { id: 'ok', label: 'Credit OK?', lane: 'Finance', phase: 'order', size: GATE, shape: { type: 'diamond' } },
  { id: 'reject', label: 'Reject order', lane: 'Sales', phase: 'order' },
  { id: 'pick', label: 'Pick & pack', lane: 'Picking', phase: 'fulfil' },
  { id: 'ship', label: 'Ship', lane: 'Dispatch', phase: 'fulfil' },
  { id: 'receive', label: 'Receive goods', lane: 'Customer', phase: 'fulfil' },
  { id: 'invoice', label: 'Send invoice', lane: 'Finance', phase: 'bill' },
  { id: 'pay', label: 'Pay invoice', lane: 'Customer', phase: 'bill' },
  { id: 'paid', label: 'Paid', lane: 'Finance', phase: 'bill', size: EVENT, shape: { type: 'terminal' } },
];
const LINKS = [
  ['placed', 'confirm'], ['confirm', 'credit'], ['credit', 'ok'], ['ok', 'pick', 'yes'], ['ok', 'reject', 'no'],
  ['pick', 'ship'], ['ship', 'receive'], ['receive', 'invoice'], ['invoice', 'pay'],
  ['pay', 'paid'],
];
const MAIN_PATH = ['placed', 'confirm', 'credit', 'ok', 'pick', 'ship', 'receive', 'invoice', 'pay', 'paid'];

defineDemo({
  name: 'Swimlane flow',
  blurb: 'An order-to-cash process across four lanes, the Warehouse split into two sub-lanes, in three phases: every step sits in the lane of whoever does it and the phase it belongs to, and the connections cross lanes. Move a step to another lane, resize or reorder lanes and phases by hand, fold a lane to a band, lay the pool out: every edit is one undo step.',
  howTo: [
    'Read the flow left to right: the Customer orders, Sales confirms, Finance checks the credit and, if it is OK, the Warehouse picks and ships; the Customer receives the goods, Finance invoices and the Customer pays. The Warehouse is split into two sub-lanes, Picking and Dispatch, with its title in a strip on the left.',
    'Drag "Send invoice" up into the Sales lane and let go: it now belongs to Sales and sits fully inside it. Press Undo: it is back in Finance.',
    'Point at the line between two lanes: the cursor turns into a resize arrow. Drag it down: the lane above gets taller, the pool grows with it and the other lanes keep their size.',
    'Grab a lane by its title strip (the cursor shows a hand) and drag it above another lane: the lane moves there, its steps with it.',
    'Drag "Ship" up from Dispatch into Picking: it belongs to Picking now. Grab Dispatch by its title and drag it above Picking: the two sub-lanes swap inside the Warehouse, which stays where it is. Grab the Warehouse by its strip on the left to move the whole lane, sub-lanes and all.',
    'The band along the top names the phases: Order, Fulfil, Bill. Drag the line between two phase names: that phase gets longer, the pool with it, and the steps after it move along. Drag a phase by its name to move it, its steps with it.',
    'Press Fold Finance: the lane folds to a thin band across the pool, the connections meet the band, and the pool closes up. Press it again to unfold.',
    'Drag a few steps along their lanes to make a mess, then press Lay out: the steps line up along their connections again, each in its own lane and its own phase.',
    'Press Vertical pool: the same process with the lanes as columns, running top to bottom.',
  ],
  reactflow: null,

  async setup(ctx) {
    const api = render({ nodes: [], edges: [] }, ctx.host);
    ctx.instance = api;
    ctx.engine = api.getEngine();
    ctx.diagram = api.getModel();
    const model = ctx.diagram, engine = ctx.engine, cm = engine.commandManager;
    const log = document.getElementById('flow-log');
    const $ = (id) => document.getElementById(id);
    let svc, pool, lanes, orientation = 'horizontal';

    const laneOf = (id) => svc.getLeafLanes(pool).find((l) => l.members.has(id));
    /** A lane by name, at any depth (a top lane or a sub-lane). */
    const laneNamed = (name) => [...svc.getLanes(pool), ...svc.getLeafLanes(pool)].find((l) => l.name === name);
    const finance = () => laneNamed('Finance');

    const build = (o = orientation) => {
      orientation = o;
      for (const n of [...model.getNodes()]) model.removeNode(n.id);
      for (const g of [...model.getGroups()]) model.removeGroup(g.id);
      svc = new SwimlaneService(model, { dispatcher: cm });
      const plain = new SwimlaneService(model); // building is not an edit: no history
      ({ pool, lanes } = plain.createPool({
        name: 'Order to cash', orientation,
        bounds: orientation === 'horizontal' ? { x: 0, y: 0, width: 1400, height: 640 } : { x: 0, y: 0, width: 760, height: 1300 },
        lanes: LANES.map(({ name }) => ({ name })),
        headerSize: 40,
        phases: PHASES,
      }));
      for (const l of LANES) if (l.subs) plain.splitLane(pool, lanes.find((x) => x.name === l.name).id, l.subs.map((name) => ({ name })));
      const phaseStart = Object.fromEntries(plain.getPhases(pool).map((ph) => [ph.id, ph.start]));
      api.setNodes(STEPS.map((s) => {
        const b = laneNamed(s.lane).getInnerBounds();
        // each step starts in its phase; the layout then keeps it there
        const at = orientation === 'horizontal' ? { x: Math.max(b.x, phaseStart[s.phase]) + 10, y: b.y + 30 } : { x: b.x + 10, y: Math.max(b.y, phaseStart[s.phase]) + 10 };
        return { id: s.id, label: s.label, position: at, size: { ...(s.size ?? STEP) }, ...(s.shape ? { shape: s.shape } : {}) };
      }));
      for (const s of STEPS) laneNamed(s.lane).addMember(s.id, model);
      api.setEdges(LINKS.map(([source, target, label]) => ({ id: `${source}-${target}`, source, target, type: 'orthogonal', ...(label ? { label } : {}) })));
      layoutPool(model, pool, { rankSpacing: 48 });
      cm.clear();
      $('turn').textContent = orientation === 'horizontal' ? 'Vertical pool' : 'Horizontal pool';
      $('fold').textContent = 'Fold Finance';
      ctx.svc = svc; ctx.pool = pool; ctx.lanes = lanes;
      api.fitView(32);
      api.renderNow();
      sync();
    };

    function sync() {
      $('undo').disabled = !cm.canUndo();
      $('redo').disabled = !cm.canRedo();
      $('fold').textContent = finance()?.isCollapsed ? 'Unfold Finance' : 'Fold Finance';
    }
    for (const ev of ['command:executed', 'command:undone', 'command:redone', 'command:history-cleared']) engine.eventBus.on(ev, () => sync());

    // Say what a drop did.
    let where = new Map();
    const remember = () => { where = new Map(STEPS.map((s) => [s.id, laneOf(s.id)?.name])); };
    api.on('nodes:change', () => setTimeout(() => {
      for (const s of STEPS) {
        const now = laneOf(s.id)?.name;
        if (now && where.get(s.id) && now !== where.get(s.id)) log.textContent = `"${s.label}" is now done by ${now}.`;
      }
      remember();
      api.renderNow();
    }, 0));

    $('lay-out').addEventListener('click', () => {
      svc.editPool(pool, 'Lay out', () => layoutPool(model, pool, { rankSpacing: 48 }));
      api.renderNow();
      log.textContent = 'Laid out: steps along their connections, each in its own lane.';
    });
    $('fold').addEventListener('click', async () => {
      const lane = finance();
      if (lane.isCollapsed) await engine.expandGroup(lane.id);
      else await engine.collapseGroup(lane.id);
      api.renderNow();
      sync();
      log.textContent = lane.isCollapsed ? 'Finance folded to a band; its steps are hidden.' : 'Finance unfolded where it was.';
    });
    let added = 0;
    $('add-lane').addEventListener('click', () => {
      added += 1;
      const lane = svc.addLane(pool, { name: added === 1 ? 'Legal' : `Lane ${LANES.length + added}` });
      api.renderNow();
      log.textContent = `Added the "${lane.name}" lane.`;
    });
    $('turn').addEventListener('click', () => {
      build(orientation === 'horizontal' ? 'vertical' : 'horizontal');
      remember();
      log.textContent = orientation === 'vertical' ? 'The lanes are columns now; the flow runs top to bottom.' : 'The lanes are rows again.';
    });
    $('undo').addEventListener('click', async () => { await cm.undo(); api.renderNow(); remember(); });
    $('redo').addEventListener('click', async () => { await cm.redo(); api.renderNow(); remember(); });
    $('reset').addEventListener('click', () => { build('horizontal'); remember(); log.textContent = 'Drag a step to another lane.'; });

    build('horizontal');
    remember();

    // For the checks: a hand-speed drag in world coordinates, through the real pointer path.
    ctx.drag = async (from, to, steps = 10) => {
      const rect = ctx.host.getBoundingClientRect();
      const fire = (type, w) => {
        const c = api.viewport.worldToClient(w.x, w.y, rect);
        const target = document.elementFromPoint(c.x, c.y) || ctx.host;
        target.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 1, pointerType: 'mouse', clientX: c.x, clientY: c.y, button: 0, buttons: type === 'pointerup' ? 0 : 1 }));
      };
      fire('pointermove', from); fire('pointerdown', from);
      for (let i = 1; i <= steps; i++) fire('pointermove', { x: from.x + ((to.x - from.x) * i) / steps, y: from.y + ((to.y - from.y) * i) / steps });
      fire('pointerup', to);
      await new Promise((r) => setTimeout(r, 40));
      api.renderNow();
    };
    ctx.laneOf = laneOf;
    ctx.lane = laneNamed;
    ctx.reset = () => { build('horizontal'); remember(); };
    await ctx.tick();
  },

  async assert(ctx) {
    ctx.reset();
    const m = ctx.diagram, engine = ctx.engine, cm = engine.commandManager;
    let svc = ctx.svc, pool = ctx.pool;
    const lane = (name) => ctx.lane(name);
    const box = (id) => { const n = m.getNode(id); return { x: n.position.x, y: n.position.y, w: n.size.width, h: n.size.height }; };
    const centre = (id) => { const b = box(id); return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; };
    const inside = (id, l) => { const b = box(id), r = l.getInnerBounds(); return b.x >= r.x - 0.5 && b.y >= r.y - 0.5 && b.x + b.w <= r.x + r.width + 0.5 && b.y + b.h <= r.y + r.height + 0.5; };
    const tiled = () => { const b = svc.getLanes(pool).map((l) => l.getOuterBounds()); return b.every((r, i) => i === 0 || Math.abs(r.y - (b[i - 1].y + b[i - 1].height)) < 1); };
    const heights = () => svc.getLanes(pool).map((l) => Math.round(l.getOuterBounds().height));
    const flowReads = () => MAIN_PATH.every((id, i) => i === 0 || box(id).x > box(MAIN_PATH[i - 1]).x);
    const everyStepHome = () => STEPS.every((s) => ctx.laneOf(s.id) === lane(s.lane) && inside(s.id, lane(s.lane)));
    const phase = (id) => svc.getPhases(pool).find((p) => p.id === id);
    const inPhase = (s) => { const p = phase(s.phase), b = box(s.id); return b.x >= p.start - 0.5 && b.x + b.w <= p.end + 0.5; };
    const everyStepInPhase = () => STEPS.every(inPhase);
    const pause = (ms = 30) => new Promise((r) => setTimeout(r, ms));

    // 1. Four lanes tile the pool, the Warehouse split into Picking and Dispatch; every step in its own lane; the main path reads left to right.
    check(svc.getLanes(pool).map((l) => l.name).join() === TOP.join(), `the lanes should be ${TOP.join(', ')}`);
    check(svc.getLeafLanes(pool).map((l) => l.name).join() === 'Customer,Finance,Sales,Picking,Dispatch', 'the Warehouse should be split into Picking and Dispatch');
    check(tiled(), 'the four lanes should tile the pool');
    check(everyStepHome(), 'every step should start inside its own lane');
    check(flowReads(), 'the main path should read left to right');
    check(svc.getPhases(pool).map((p) => p.name).join() === 'Order,Fulfil,Bill', 'the pool should have the phases Order, Fulfil, Bill');
    check(everyStepInPhase(), 'every step should start inside its own phase');

    // 2. A step dragged into another lane joins it, fully inside; Undo takes it back.
    const sales = lane('Sales').getOuterBounds();
    await ctx.drag(centre('invoice'), { x: centre('invoice').x, y: sales.y + sales.height / 2 + 10 });
    check(ctx.laneOf('invoice') === lane('Sales'), `"Send invoice" should now be in Sales, it is in ${ctx.laneOf('invoice')?.name}`);
    check(inside('invoice', lane('Sales')), '"Send invoice" should sit fully inside Sales');
    check(!document.getElementById('undo').disabled, 'Undo should be live after a drop');
    document.getElementById('undo').click();
    await pause();
    check(ctx.laneOf('invoice') === lane('Finance') && inside('invoice', lane('Finance')), 'Undo should put "Send invoice" back in Finance');

    // 3. The line under Customer, dragged down by hand: Customer grows, the pool with it, the others keep their size.
    const h0 = heights(), p0 = pool.getOuterBounds();
    const c0 = lane('Customer').getOuterBounds();
    await ctx.drag({ x: c0.x + c0.width - 40, y: c0.y + c0.height }, { x: c0.x + c0.width - 40, y: c0.y + c0.height + 60 });
    const h1 = heights();
    check(Math.abs(h1[0] - (h0[0] + 60)) <= 1 && h1.slice(1).join() === h0.slice(1).join(), `dragging Customer's border should make only Customer 60 taller (${h0} → ${h1})`);
    check(Math.abs(pool.getOuterBounds().height - (p0.height + 60)) <= 1, 'the pool should grow with the lane');
    check(tiled() && everyStepHome(), 'after a lane resize the lanes should tile and every step stay in its lane');
    await cm.undo();
    check(heights().join() === h0.join(), 'one Undo should restore the lane sizes');

    // 4. Finance dragged by its title above Customer: the lane moves, its steps ride along.
    const f0 = lane('Finance').getOuterBounds();
    await ctx.drag({ x: f0.x + 300, y: f0.y + 10 }, { x: f0.x + 300, y: pool.getOuterBounds().y + 4 }, 16);
    check(svc.getLanes(pool).map((l) => l.name).join() === 'Finance,Customer,Sales,Warehouse', `Finance should now come first, got ${svc.getLanes(pool).map((l) => l.name)}`);
    check(tiled() && everyStepHome(), 'after a reorder the lanes should tile and every step stay in its lane');
    await cm.undo();
    check(svc.getLanes(pool).map((l) => l.name).join() === TOP.join(), 'one Undo should put the lanes back in order');

    // 5. Sub-lanes: "Ship" dragged from Dispatch into Picking joins it; Dispatch dragged by its title above Picking swaps the two inside the Warehouse.
    const pk = lane('Picking').getOuterBounds();
    await ctx.drag(centre('ship'), { x: centre('ship').x, y: pk.y + pk.height / 2 + 10 });
    check(ctx.laneOf('ship') === lane('Picking') && inside('ship', lane('Picking')), `"Ship" should now be in Picking, it is in ${ctx.laneOf('ship')?.name}`);
    await cm.undo();
    check(ctx.laneOf('ship') === lane('Dispatch'), 'one Undo should put "Ship" back in Dispatch');
    const d0 = lane('Dispatch').getOuterBounds();
    await ctx.drag({ x: d0.x + 400, y: d0.y + 10 }, { x: d0.x + 400, y: lane('Picking').getOuterBounds().y + 4 }, 16);
    check(svc.getLeafLanes(pool).map((l) => l.name).join() === 'Customer,Finance,Sales,Dispatch,Picking', `Dispatch should now come before Picking, got ${svc.getLeafLanes(pool).map((l) => l.name)}`);
    check(svc.getLanes(pool).map((l) => l.name).join() === TOP.join(), 'swapping sub-lanes should leave the lanes where they are');
    check(everyStepHome(), 'after swapping sub-lanes every step should stay in its lane');
    await cm.undo();
    check(svc.getLeafLanes(pool).map((l) => l.name).join() === 'Customer,Finance,Sales,Picking,Dispatch', 'one Undo should swap them back');

    // 5b. Phases by hand: the line after Order, dragged right in the header, makes Order longer; the pool grows and the later steps move along.
    const o0 = phase('order'), w0 = pool.getOuterBounds().width, inv0 = box('invoice').x, conf0 = box('confirm').x;
    const headY = pool.getOuterBounds().y + 10;
    await ctx.drag({ x: o0.end, y: headY }, { x: o0.end + 80, y: headY });
    check(Math.abs(phase('order').end - (o0.end + 80)) <= 1 && Math.abs(pool.getOuterBounds().width - (w0 + 80)) <= 1, 'dragging the line after Order should make Order (and the pool) 80 longer');
    check(Math.abs(box('invoice').x - (inv0 + 80)) <= 1 && Math.abs(box('confirm').x - conf0) <= 1, 'the steps after Order should move along; the ones in it should stay');
    await cm.undo();
    check(Math.abs(phase('order').end - o0.end) <= 1 && Math.abs(box('invoice').x - inv0) <= 1, 'one Undo should give Order its length back');
    // …and Bill, dragged by its name in front of Order, takes its steps with it.
    const bill0 = phase('bill');
    await ctx.drag({ x: bill0.start + 30, y: headY }, { x: phase('order').start + 10, y: headY }, 20);
    check(svc.getPhases(pool).map((p) => p.name).join() === 'Bill,Order,Fulfil', `Bill should now come first, got ${svc.getPhases(pool).map((p) => p.name)}`);
    check(everyStepInPhase() && everyStepHome(), 'after moving a phase every step should still be in its phase and its lane');
    await cm.undo();
    check(svc.getPhases(pool).map((p) => p.name).join() === 'Order,Fulfil,Bill' && everyStepInPhase(), 'one Undo should put the phases (and their steps) back');

    // 6. Fold Finance: a band, the pool closes up, a drop onto the band goes home; unfold restores.
    const pf = pool.getOuterBounds().height, ff = lane('Finance').getOuterBounds().height;
    document.getElementById('fold').click();
    await pause(40);
    check(lane('Finance').isCollapsed && Math.round(lane('Finance').getOuterBounds().height) === 44, 'Finance should fold to a 44px band');
    check(Math.abs(pool.getOuterBounds().height - (pf - ff + 44)) <= 1, 'the pool should give the folded space back');
    check(m.getNode('credit').state.visible === false, "Finance's steps should be hidden while it is folded");
    const band = lane('Finance').getOuterBounds(), pay0 = { ...m.getNode('pay').position };
    await ctx.drag(centre('pay'), { x: centre('pay').x, y: band.y + band.height / 2 });
    check(Math.abs(m.getNode('pay').position.y - pay0.y) < 1 && ctx.laneOf('pay') === lane('Customer'), 'a step dropped on a folded band should go back where it came from');
    document.getElementById('fold').click();
    await pause(40);
    check(!lane('Finance').isCollapsed && Math.abs(pool.getOuterBounds().height - pf) <= 1, 'unfolding should give Finance its size back');
    check(everyStepHome(), 'after unfolding every step should be in its lane again');

    // 7. A mess, then Lay out: the flow reads again; one Undo brings the mess back.
    // (inside its own phase: a step dragged into another phase belongs to that one)
    await ctx.drag(centre('pay'), { x: phase('bill').start + 70, y: centre('pay').y });
    check(!flowReads(), 'the dragged step should have broken the reading order (precondition)');
    document.getElementById('lay-out').click();
    await pause();
    check(flowReads() && everyStepHome() && tiled() && everyStepInPhase(), 'Lay out should line the steps up along the flow, each in its own lane and phase');
    await cm.undo();
    check(!flowReads(), 'one Undo should bring the pre-layout positions back');

    // 8. The engine's own layout keeps the pool whole too.
    await engine.layout('layered', { direction: 'LR' });
    check(tiled() && everyStepHome(), 'engine.layout() should keep the lanes tiled and every step in its lane');

    // 9. A full lane refuses a step: it goes home.
    lane('Picking').capacity = 1; // Picking holds "Pick & pack"
    const rc0 = { ...m.getNode('receive').position };
    const pkb = lane('Picking').getOuterBounds();
    await ctx.drag(centre('receive'), { x: centre('receive').x, y: pkb.y + pkb.height / 2 });
    check(ctx.laneOf('receive') === lane('Customer') && Math.abs(m.getNode('receive').position.y - rc0.y) < 1, 'a full lane should send the step back where it came from');
    lane('Picking').capacity = undefined;

    // 10. + Lane adds a lane, one Undo takes it away.
    document.getElementById('add-lane').click();
    check(svc.getLanes(pool).length === 5 && tiled(), '+ Lane should add a fifth lane that tiles');
    await pause(); // the edit reaches the undo stack a moment later
    await cm.undo();
    check(svc.getLanes(pool).length === 4, 'one Undo should remove the added lane');

    // 11. The vertical pool: lanes are columns (the Warehouse's sub-lanes too) and the flow runs top to bottom.
    document.getElementById('turn').click();
    svc = ctx.svc; pool = ctx.pool;
    const cols = svc.getLanes(pool).map((l) => l.getOuterBounds());
    check(cols.every((r, i) => i === 0 || Math.abs(r.x - (cols[i - 1].x + cols[i - 1].width)) < 1), 'in the vertical pool the lanes should tile as columns');
    check(MAIN_PATH.every((id, i) => i === 0 || box(id).y > box(MAIN_PATH[i - 1]).y), 'in the vertical pool the flow should run top to bottom');
    check(STEPS.every((s) => inside(s.id, lane(s.lane))), 'in the vertical pool every step should be in its lane');
    ctx.reset();
  },
});
</script>
