name: Live site

jobs:
  gallery:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages')
    name: Gallery on grafloria.com
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node demos/e2e/gallery-run.mjs --origin https://grafloria.com/demos
      # Every page of the site, as a reader opens it: no errors, no missing file,
      # no example stuck loading, no link to nowhere.
      - run: node demos/e2e/site-run.mjs
      # Code text is coloured by chalkColors on the deployed pages too (Monaco comes from a CDN).
      - run: node demos/e2e/code-colour-run.mjs --origin https://grafloria.com
