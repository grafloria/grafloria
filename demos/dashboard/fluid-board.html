<style>
  /* ================================================================================
     THE BOARD IS A LAYOUT, NOT A PICTURE. dashboard-builder.html authors a 1180-px
     world and lets the camera frame it — the 'fixed' mode, right for a dashboard
     that lives inside a larger diagram. This page is the DEFAULT: no width authored,
     so the board is the container's own CSS pixels at zoom 1, exactly as gridstack
     or react-grid-layout would lay it out. Shrink the container and the board
     re-lays out; it never shrinks the type.
     ================================================================================ */
  #fb-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--gf-line, rgba(127,127,127,.24)); font: 500 12.5px/1.3 system-ui, sans-serif; }
  #fb-bar button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(127,127,127,.35); background: transparent; color: inherit; cursor: pointer; }
  #fb-bar button[aria-pressed="true"] { background: rgba(59, 82, 217, .12); border-color: #3b52d9; }
  #fb-bar .fb-sep { width: 1px; height: 18px; background: rgba(127,127,127,.3); margin: 0 4px; }
  #fb-bar .fb-lab { display: inline-flex; align-items: center; gap: 6px; }
  /* Pinned so the toolbar cannot reflow when an option's TEXT changes: a
     select is sized to its widest option, so renaming one shifted the whole
     board a few px and every visual golden with it. */
  #fb-caption { width: 190px; }
  #fb-bar select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid rgba(127,127,127,.35); background: transparent; color: inherit; }
  #fb-bar select:disabled { opacity: .45; }
  #fb-bar .fb-msg { margin-left: auto; opacity: .75; font-variant-numeric: tabular-nums; }
  #fb-bar .fb-msg.refused { color: #b3261e; opacity: 1; }
  /* The container is what the board follows: 100% wide, or 60% when "narrow". */
  #fb-stage { width: 100%; }
  #fb-stage.narrow { width: 60%; }
  #canvas { position: relative; overflow: hidden; width: 100%; height: calc(100vh - 140px); min-height: 480px; }
</style>

<div id="demo-head"></div>
<div id="fb-bar">
  <button id="fb-narrow" aria-pressed="false" title="Make the container 60% wide — the board follows">Narrow container</button>
  <span class="fb-sep"></span>
  <button id="fb-fit" aria-pressed="false">Fit</button>
  <button id="fb-grow" aria-pressed="true">Grow</button>
  <span class="sep"></span>
  <button id="fb-grid" aria-pressed="true" title="The cell grid: columns, spans, push">Grid</button>
  <button id="fb-split" aria-pressed="false" title="The splitter tree: the board is always covered, dividers are percentages">Split</button>
  <span class="fb-sep"></span>
  <label class="fb-lab" title="Where a widget can be grabbed: anywhere on the card, only its caption strip (DevExpress caption drag), or only a painted grip">Drag
    <select id="fb-drag"><option value="anywhere">anywhere</option><option value="caption">by caption</option><option value="grip">by grip</option></select></label>
  <select id="fb-grip-pos" disabled title="Where the grip sits along the top edge"><option value="left">left</option><option value="center">center</option><option value="right">right</option></select>
  <select id="fb-grip-place" disabled title="Inside the header band, or a tab above the card"><option value="inside">inside</option><option value="outside">outside</option></select>
  <span class="fb-sep"></span>
  <label class="fb-lab" title="The Operations section's caption, painted by the kit — handle.setCaption() switches it live">Caption

import { Component, signal } from '@angular/core';
import { GrafloriaDashboardComponent } from '@grafloria/angular';
import type { DashboardHandle, DashboardViewSpec } from '@grafloria/element';

@Component({
  selector: 'app-fluid-board',
  imports: [GrafloriaDashboardComponent],
  template: `
    <div class="bar">
      <button (click)="sizing.set('fit')">Fit</button>
      <button (click)="sizing.set('grow')">Grow</button>
      <button (click)="layout.set('grid')">Grid</button>
      <button (click)="layout.set('split')">Split</button>
      <button (click)="handle?.setDragHandle(true)">Drag by caption</button>
      <button (click)="handle?.setDragHandle({ grip: true, position: 'right', placement: 'outside' })">Grip outside</button>
      <button (click)="handle?.setDragHandle(false)">Drag anywhere</button>
      <button (click)="handle?.addWidget({ id: 'row-' + Date.now(), kind: 'kpi', span: 12, rows: 1, data: { label: 'Row', value: '+1' } })">+ Add a row</button>
    </div>
    <!-- No width → mode 'fluid': the board is 100% of this element at zoom 1 and GROWS by default; 'fit' keeps the height and squeezes rows; 'split' is the DevExpress splitter tree. -->
    <grafloria-dashboard
      [views]="views" [options]="options"
      [layout]="layout()" [sizing]="sizing()"
      (ready)="handle = $event"
      (layoutChange)="onLayout($event)"
      style="display:block; height:calc(100vh - 140px)" />
  `,
})

import { render, dashboard } from '../shell/grafloria.js';
import { defineDemo, check, checkEqual } from '../shell/demo.js?v=drawer4';

// No `width` → mode 'fluid' (an explicit width would make it 'fixed').

    ctx2.drag('grip', 'left', 'inside');
    await settle();
    checkEqual(JSON.stringify(H.getDragHandle()), JSON.stringify({ grip: true, position: 'left', placement: 'inside' }), 'a painted grip, left, inside');
    const grips = () => [...document.querySelectorAll('.grafloria-node-host > .axdb-grip')];
    checkEqual(grips().length, document.querySelectorAll('.grafloria-node-host').length, 'every widget card carries one grip (a section has no card)');
    check(!document.querySelector('.axdb-drag-handle'), 'and the caption class is gone (the grip is the only handle)');
    const hostRect = (g) => g.parentElement.getBoundingClientRect();
    // Grips show on the SELECTED widget only (the DevExpress designer's item bar).
    check(grips().every((g) => getComputedStyle(g).opacity === '0'), 'nothing selected: every grip is hidden');
    H.focusWidget('trend');
    await settle();
    await new Promise((r) => setTimeout(r, 250)); // the grip fades in over 120 ms
    const tGrip = document.querySelector('.grafloria-node-host[data-node-id="trend"] > .axdb-grip');
    checkEqual(getComputedStyle(tGrip).opacity, '1', 'selecting the chart shows ITS grip');
    checkEqual(grips().filter((g) => getComputedStyle(g).opacity === '1').length, 1, 'and only its grip');
    check(grips().every((g) => { const r = g.getBoundingClientRect(), h = hostRect(g); return r.top >= h.top && r.left - h.left < 20; }), 'inside-left: the grip sits in the header band, flush with the card padding');
    const hdr = document.querySelector('.grafloria-node-host[data-node-id="trend"] .axdb-widget-h').getBoundingClientRect();
    const gr = tGrip.getBoundingClientRect();
    check(Math.abs((gr.top + gr.bottom) / 2 - (hdr.top + hdr.bottom) / 2) <= 3, 'and is centred on the caption text line');
    check(parseFloat(getComputedStyle(document.querySelector('.axdb-gp-left .axdb-widget-h')).paddingLeft) >= 20, 'and the header makes room for it');
    ctx2.drag('grip', 'right', 'outside');
    await settle();
    check(grips().every((g) => { const r = g.getBoundingClientRect(), h = hostRect(g); return r.bottom <= h.top + 1 && h.right - r.right < 12; }), 'outside-right: the grip is a tab above the card at the right edge');
    ctx2.drag('grip', 'center', 'inside');
    await settle();
    check(grips().every((g) => { const r = g.getBoundingClientRect(), h = hostRect(g); return Math.abs((r.left + r.right) / 2 - (h.left + h.right) / 2) < 2; }), 'center: the grip is centred on the card');
    ctx2.drag('anywhere');
    await settle();
    checkEqual(H.getDragHandle(), false, 'off again: the whole card is the handle');
    checkEqual(grips().length, 0, 'and the grips are gone');

    // ---- ⑨ the section caption: painted, reserved, routed, live, undoable ----
    ctx2.caption('default');
    await settle();
    const slab = () => host.querySelector('.axdb-slab[data-slab-id="ops"]');
    const band = () => slab()?.querySelector(':scope > .axdb-slab-h');
    check(!!band(), 'the section carries a caption band on its overlay');
    checkEqual(band().querySelector('.axdb-slab-h-text').textContent, 'Operations', 'the band shows the title');
    checkEqual(band().querySelector('.axdb-slab-h-sub').textContent, 'live since 08:00', 'and the subtitle');
    checkEqual(Math.round(band().getBoundingClientRect().height), 44, 'a band with a subtitle is 44 px');
    const orders = host.querySelector('.grafloria-node-host[data-node-id="orders"]').getBoundingClientRect();
    const bandR = band().getBoundingClientRect();
    check(orders.top >= bandR.bottom - 0.5, 'the children start below the band: its pixels are reserved');
    check(Math.abs(bandR.width - slab().getBoundingClientRect().width) < 1, 'the band spans the section frame');
    checkEqual(band().querySelectorAll('.axdb-slab-h-action').length, 2, 'two action buttons at the end');
    // a press on the action fires onCaptionAction and selects nothing
    H.selectWidget(undefined);
    await settle();
    const maxBtn = band().querySelector('.axdb-slab-h-action[data-action="max"]');
    maxBtn.click(); // a real button: a click from the mouse, a touch or the keyboard
    await settle();
    check(document.getElementById('fb-msg').textContent.includes('caption action "max" on ops'), 'a press on ⤢ reaches onCaptionAction');
    checkEqual(H.getSelectedWidget(), undefined, 'and selects nothing');
    // a press on the band selects the section
    const text = band().querySelector('.axdb-slab-h-text');
    const tr = text.getBoundingClientRect();
    for (const type of ['pointerdown', 'pointerup']) text.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: tr.x + 4, clientY: tr.y + tr.height / 2, pointerId: 8, button: 0, isPrimary: true }));
    await settle();
    checkEqual(H.getSelectedWidget(), 'ops', 'a press on the band selects the section');
    check(slab().classList.contains('axdb-slab--selected'), 'and the section wears the ring');
    // live restyles, each one undo step
    ctx2.caption('tab');
    await settle();
    const tabR = band().getBoundingClientRect(), slabR = slab().getBoundingClientRect();
    check(band().classList.contains('axdb-slab-h--tab') && tabR.width < slabR.width - 40 && Math.abs(tabR.x - slabR.x) < 1, 'a tab is the band sized to its text, at the leading corner');
    check(tabR.top >= slabR.top - 0.5 && tabR.bottom <= slabR.bottom, 'inside its own frame — never over the widget above it');
    const ordersTab = host.querySelector('.grafloria-node-host[data-node-id="orders"]').getBoundingClientRect();
    check(ordersTab.top >= tabR.bottom - 0.5, 'and it reserves its height, like an inside band');
    ctx2.caption('center');
    await settle();
    checkEqual(getComputedStyle(band()).textTransform, 'uppercase', 'centred: uppercase from the font option');
    checkEqual(getComputedStyle(band()).justifyContent, 'center', 'and centred');
    ctx2.caption('none');
    await settle();
    check(!band(), 'none: the band is gone');
    check(Math.abs(host.querySelector('.grafloria-node-host[data-node-id="orders"]').getBoundingClientRect().top - slab().getBoundingClientRect().top) < 1, 'and the rows are back');
    const cm = api.getEngine().commandManager;
    await cm.undo(); await settle();
    check(!!band() && getComputedStyle(band()).textTransform === 'uppercase', 'undo brings the centred caption back');
    await cm.undo(); await cm.undo(); await settle();
    checkEqual(band()?.querySelector('.axdb-slab-h-sub')?.textContent, 'live since 08:00', 'two more undos: the default caption again');
    checkEqual(H.toJSON().views[0].widgets.find((w) => w.id === 'ops').caption.subtitle, 'live since 08:00', 'and the snapshot carries it');
    ctx2.caption('default');
    await settle();
  },
});
</script>
