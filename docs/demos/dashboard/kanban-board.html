<!doctype html>
<meta charset="utf-8">
<title>Kanban board — Grafloria</title>
<meta name="description" content="A Kanban board from dashboard() data: cards stack in one-column sections, size to their own text (autoHeight), and canDrop keeps them in columns and enforces WIP limits.">
<link rel="canonical" href="https://grafloria.com/demos/dashboard/kanban-board.html">
<meta property="og:title" content="Kanban board — Grafloria">
<meta property="og:description" content="A Kanban board from dashboard() data: cards stack in one-column sections, size to their own text (autoHeight), and canDrop keeps them in columns and enforces WIP limits.">
<meta property="og:url" content="https://grafloria.com/demos/dashboard/kanban-board.html">
<meta property="og:image" content="https://grafloria.com/demos/thumbs/dashboard/kanban-board.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://grafloria.com/demos/thumbs/dashboard/kanban-board.png">
<link rel="stylesheet" href="../shell/demo.css?v=drawer4">
<style>
  /* ================================================================================
     A KANBAN BOARD ON THE PACK GRID. Every column is a CONTAINER with `columns: 1` and gravity on (float off), so its
     cards stack top-down, close the gap a card leaves, and reorder by push. Cards
     are `autoHeight`: the kit measures them and takes whole rows. `canDrop` keeps
     cards inside columns and refuses a column at its WIP limit.
     ================================================================================ */
  #canvas { width: 100%; height: calc(100vh - 90px); min-height: 560px; }
  /* Each stage's tint (the section `background`), and the ring the kit draws on the
     stage a dragged card will land in (blue) or that refuses it (orange). */
  :root { --kb-st-backlog: #eceff5; --kb-st-doing: #e6eefc; --kb-st-review: #fbf1df; --kb-st-done: #e4f3ea; }

  .kb-card { box-sizing: border-box; height: 100%; padding: 8px 10px; border-radius: 8px;
    background: var(--kb-card, #fff); border: 1px solid var(--kb-line, #dfe3ea);
    font: 13px/1.35 system-ui, sans-serif; color: var(--kb-ink, #1d2330); overflow: hidden; }
  .kb-card .t { font-weight: 600; margin-bottom: 4px; }
  .kb-card .d { color: var(--kb-muted, #5d6576); font-size: 12px; margin-bottom: 6px; }
  .kb-card .m { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--kb-muted, #5d6576); }
  .kb-card .tag { padding: 1px 6px; border-radius: 999px; background: var(--kb-tag, #eef1fb); color: #3b52d9; }
  .kb-card .who { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    background: #3b52d9; color: #fff; font-size: 10px; font-weight: 600; }

  .kb-head { display: flex; align-items: center; gap: 8px; height: calc(100% - 12px); padding: 0 6px; white-space: nowrap; overflow: hidden;
    font: 600 13px system-ui, sans-serif; color: var(--kb-ink, #1d2330); }
  .kb-head .n { font-weight: 500; color: var(--kb-muted, #5d6576); font-variant-numeric: tabular-nums; }
  .kb-head .n.over { color: #c2410c; font-weight: 700; }
  .kb-head > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .kb-head button { flex: none; margin-left: auto; border: 1px solid var(--kb-line, #dfe3ea); background: transparent; color: inherit;
    border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; font-weight: 500; }

  @media (prefers-color-scheme: dark) {
    :root { --kb-st-backlog: #1e222a; --kb-st-doing: #1a2436; --kb-st-review: #2b2417; --kb-st-done: #18271f; }
    :root { --kb-card: #1f232b; --kb-line: #353b47; --kb-ink: #e6e9ef; --kb-muted: #9aa3b5; --kb-tag: #27305a; }
  }
</style>

<div id="demo-head"></div>
<div id="canvas"></div>

<script type="module">
import { render, dashboard } from '../shell/grafloria.js';
import { defineDemo, check, checkEqual } from '../shell/demo.js?v=drawer4';

const ROW = 8;        // row unit, px — small, so a card's height rounds up by at most ROW + GAP
const HEAD_ROWS = 3;  // the column header spans this many parent row units (3 × 16 = 48 px: 36 px of header, 12 px of air above the first card)
const GAP = 8;
const EMPTY_ROWS = 30; // a stage's inner height in rows when its cards need less: room to drop into
const COLUMNS = [
  { id: 'backlog', name: 'Backlog',                tint: 'var(--kb-st-backlog)' },
  { id: 'doing',   name: 'In progress', wip: 3,    tint: 'var(--kb-st-doing)' },
  { id: 'review',  name: 'Review',      wip: 2,    tint: 'var(--kb-st-review)' },
  { id: 'done',    name: 'Done',                   tint: 'var(--kb-st-done)' },
];
const CARDS = {
  backlog: [
    { title: 'Export the board as PDF', tag: 'export', who: 'RO' },
    { title: 'Keyboard shortcuts for moving a card between columns', desc: 'Ctrl+← / Ctrl+→ moves the focused card; the screen reader announces the new column and position.', tag: 'a11y', who: 'MS' },
    { title: 'Swimlanes by assignee', tag: 'idea', who: 'LK' },
  ],
  doing: [
    { title: 'Content-driven card height', desc: 'Cards measure their content and take whole rows.', tag: 'kit', who: 'RO' },
    { title: 'WIP limits per column', tag: 'kit', who: 'MS' },
  ],
  review: [
    { title: 'Undo a cross-column move in one step', tag: 'kit', who: 'LK' },
  ],
  done: [],
};

/* ---- cards: paint + measure ---------------------------------------------------- */
function paintCard(el, d) {
  el.className = 'kb-card';
  el.innerHTML = '';
  const t = document.createElement('div'); t.className = 't'; t.textContent = d.title; el.append(t);
  if (d.desc) { const p = document.createElement('div'); p.className = 'd'; p.textContent = d.desc; el.append(p); }
  const m = document.createElement('div'); m.className = 'm';
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = d.tag ?? 'task';
  const who = document.createElement('span'); who.className = 'who'; who.textContent = d.who ?? '?';
  m.append(tag, who); el.append(m);
}
let seq = 0;
// `rows` is only the first guess: the dashboard's `autoHeight` measures the card.
const GUESS = 4;
const cardSpec = (d) => ({ id: `card-${++seq}`, kind: 'card', span: 1, rows: GUESS, resizable: false, data: d });

/* ---- column headers: painted by the page, so counts update without an undo step - */
const heads = new Map();
function paintHead(sectionId, host) {
  const col = COLUMNS.find((c) => c.id === sectionId);
  if (!col) return;
  host.replaceChildren();
  const el = document.createElement('div'); el.className = 'kb-head';
  const name = document.createElement('span'); name.textContent = col.name;
  const n = document.createElement('span'); n.className = 'n';
  const add = document.createElement('button'); add.textContent = '+ Add'; add.dataset.axdbPass = '';
  add.title = `Add a card to ${col.name}`;
  add.addEventListener('click', (e) => { e.stopPropagation(); addCard(col.id); });
  el.append(name, n, add); host.append(el);
  heads.set(sectionId, { n, add });
  updateCounts();
}

let H, api;
function countsNow() {
  const out = {};
  const view = H?.toJSON().views[0];
  for (const c of COLUMNS) out[c.id] = (view?.widgets.find((w) => w.id === c.id)?.widgets ?? []).length;
  return out;
}
function updateCounts() {
  if (!H) return;
  const counts = countsNow();
  for (const c of COLUMNS) {
    const h = heads.get(c.id);
    if (!h) continue;
    const full = !!c.wip && counts[c.id] >= c.wip;
    h.n.textContent = c.wip ? `${counts[c.id]} / ${c.wip}${full ? ' · full' : ''}` : String(counts[c.id]);
    h.n.classList.toggle('over', full);
    h.add.hidden = full;   // a full column takes no new card — the count says why
  }
}
const isFull = (columnId) => {
  const c = COLUMNS.find((x) => x.id === columnId);
  return !!c?.wip && countsNow()[columnId] >= c.wip;
};
/** The drop policy: cards live in columns, and a column at its WIP limit takes no more. */
function canDrop({ to }) {
  return COLUMNS.some((c) => c.id === to) && !isFull(to);
}

const NEW_TITLES = ['Follow up with the design review', 'Fix the flaky timing test', 'Write the release notes', 'Try a 6-column board on a phone'];
function addCard(columnId) {
  if (isFull(columnId)) return undefined;
  const d = { title: NEW_TITLES[seq % NEW_TITLES.length], tag: 'new', who: 'RO' };
  // No cell given: the kit auto-positions — with gravity that is the bottom of the list.
  const w = H.addWidget(cardSpec(d), columnId);
  updateCounts();
  return w;
}

/* ---- the board ------------------------------------------------------------------ */
function buildSpec() {
  return dashboard({
    columns: 12,
    gap: GAP,
    sizing: 'grow',
    rowHeight: ROW,
    float: false,
    autoHeight: true,
    canDrop,
    widgets: COLUMNS.map((c) => {
      // A section's inner rows are squeezed into its slab, so the slab is sized in
      // the PARENT's rows: a header of HEAD_ROWS × (ROW + GAP) and inner + HEAD_ROWS
      // parent rows give inner rows of exactly ROW. `maxRows` is the empty column's
      // height; cards measured taller grow the slab, and give the rows back.
      const inner = Math.max(EMPTY_ROWS, CARDS[c.id].length * GUESS);
      return {
        // A stage moves only by trading places with the other stages ('row'), and its
        // tint runs under the header too (a transparent band), so it reads as one panel.
        id: c.id, title: c.name, span: 3, rows: inner + HEAD_ROWS, columns: 1, pinned: true, movable: 'row', resizable: false,
        background: c.tint,
        stack: true,   // a list: a card dropped below the last one lands right after it
        caption: { text: c.name, height: HEAD_ROWS * (ROW + GAP), background: 'transparent', border: 'none' },
        maxRows: EMPTY_ROWS,
        widgets: CARDS[c.id].map(cardSpec),
      };
    }),
    // Paint INTO a child: the host carries the kit's own classes (grafloria-node-host,
    // axdb-ghost while dragged) — overwriting host.className drops the drag z-raise.
    renderWidget: (w, host) => { if (w.kind === 'card') { const el = document.createElement('div'); paintCard(el, w.data); host.replaceChildren(el); } },
    renderCaption: (w, host) => paintHead(w.id, host),
    onLayoutChange: () => updateCounts(),
  });
}

defineDemo({
  name: 'Kanban board',
  blurb: 'A Kanban board built from dashboard() data: each column is a one-column section with gravity, so cards stack, a gap closes when a card leaves, and a card dropped between two others pushes them down. A card dragged into another column is adopted live, and one undo puts the whole move back. Cards are autoHeight — as tall as their text, re-measured when the width changes — and canDrop keeps cards inside columns and refuses a column at its WIP limit.',
  howTo: [
    'Drag a card from Backlog into In progress: the column makes room where you hover, and Backlog closes the gap.',
    'Drag a card up or down inside a column to reorder it.',
    'Press "+ Add" on a column header: a new card lands at the bottom and the count updates. In progress holds 3: at the limit its "+ Add" goes and a fourth card dragged in is refused (it dims and snaps back).',
    'Drop a card below the columns: it is refused and snaps back — cards live in columns.',
    'Make the window narrower: the cards re-wrap and grow to fit; nothing is cut off.',
    'Drag a stage by its header: it only trades places with the other stages. It never drops into another stage or below the row, and one undo puts the order back.',
    'While a card is dragged, the stage it will land in has a blue ring; a stage that refuses it (full) has an orange one.',
    '⌘Z undoes a whole move — both columns at once.',
  ],

  async setup(ctx) {
    const spec = buildSpec();
    api = render(spec, ctx.host);
    H = spec.handle;
    ctx.instance = api; ctx.diagram = api.getModel(); ctx.handle = H;
    window.__lab = { H, api, D: ctx.diagram };   // the e2e probes read the live board
    api.renderNow();
    await ctx.tick();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));   // the first measure
    updateCounts();
  },

  async assert(ctx) {
    const D = ctx.diagram;
    const cm = ctx.instance.getEngine().commandManager;
    const container = ctx.host;
    const settle = async () => { ctx.instance.renderNow(); await ctx.tick(); };
    const toClient = (wx, wy) => ctx.instance.viewport.worldToClient(wx, wy, container.getBoundingClientRect());
    const raf = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    let PID = 50;
    // Dispatch on the element under the pointer, as a real mouse does: a press on
    // the canvas root is not a press on the card's HTML host.
    const pev = (type, cx, cy) => (document.elementFromPoint(cx, cy) ?? container).dispatchEvent(new PointerEvent(type, {
      clientX: cx, clientY: cy, bubbles: true, cancelable: true, composed: true,
      pointerId: PID, pointerType: 'mouse', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1,
    }));
    const drag = async (from, to, steps = 12) => {
      PID++;
      const a = toClient(from.x, from.y); pev('pointerdown', a.x, a.y);
      for (let i = 1; i <= steps; i++) {
        const c = toClient(from.x + ((to.x - from.x) * i) / steps, from.y + ((to.y - from.y) * i) / steps);
        pev('pointermove', c.x, c.y); await raf();
      }
      const c = toClient(to.x, to.y); pev('pointerup', c.x, c.y); await settle();
    };
    const center = (n) => ({ x: n.position.x + n.size.width / 2, y: n.position.y + n.size.height / 2 });
    /** A drag that stops before the release: answers the release. */
    const hold = async (from, to, steps = 12) => {
      PID++;
      const a = toClient(from.x, from.y); pev('pointerdown', a.x, a.y);
      for (let i = 1; i <= steps; i++) {
        const c = toClient(from.x + ((to.x - from.x) * i) / steps, from.y + ((to.y - from.y) * i) / steps);
        pev('pointermove', c.x, c.y); await raf();
      }
      return async () => { const c = toClient(to.x, to.y); pev('pointerup', c.x, c.y); await settle(); };
    };
    const ring = (id) => {
      const el = container.querySelector(`.axdb-slab[data-slab-id="${id}"]`);
      return el?.classList.contains('axdb-slab--refused') ? 'refused' : el?.classList.contains('axdb-slab--drop') ? 'drop' : 'none';
    };
    const stageOrder = () => COLUMNS.map((c) => D.getGroup(c.id)).sort((a, b) => a.position.x - b.position.x).map((g) => g.id);
    const header = (id) => { const g = D.getGroup(id); return { x: g.position.x + 24, y: g.position.y + 14 }; };
    const order = (col) => [...D.getGroup(col).members].map((id) => D.getNode(id)).filter(Boolean)
      .sort((a, b) => a.position.y - b.position.y).map((n) => n.id);
    const stacked = (col) => {
      const ns = order(col).map((id) => D.getNode(id));
      for (let i = 1; i < ns.length; i++) {
        const gap = ns[i].position.y - (ns[i - 1].position.y + ns[i - 1].size.height);
        if (gap < 0 || gap > GAP + 1) return false;
      }
      return true;
    };
    await settle();

    // ① construction
    checkEqual(JSON.stringify(countsNow()), JSON.stringify({ backlog: 3, doing: 2, review: 1, done: 0 }), 'the four columns hold their cards');
    for (const c of COLUMNS) check(stacked(c.id), `${c.name}: cards are stacked with no holes`);
    const tall = D.getNode('card-2'), short = D.getNode('card-1');
    check(tall.size.height > short.size.height, 'a card with a description is taller than one without (content-driven rows)');
    const clipped = () => [...container.querySelectorAll('.grafloria-node-host .kb-card')]
      .filter((el) => el.scrollHeight > el.parentElement.clientHeight + 1).map((el) => el.closest('[data-node-id]')?.dataset.nodeId ?? '?');
    const slack = () => [...container.querySelectorAll('.grafloria-node-host .kb-card')]
      .map((el) => el.parentElement.clientHeight - el.scrollHeight);
    checkEqual(clipped().join(','), '', 'autoHeight: no card is cut off');
    check(slack().every((px) => px <= ROW + GAP + 1), 'autoHeight: no card is more than one row unit taller than its content');

    // ② cross-column move: Backlog's first card into In progress, between its two cards
    const doing = order('doing');
    const mover = order('backlog')[0];
    const target = D.getNode(doing[1]);
    await drag(center(D.getNode(mover)), { x: center(target).x, y: target.position.y + 6 });
    check(D.getGroup('doing').members.has(mover), 'the card crossed into In progress');
    check(!D.getGroup('backlog').members.has(mover), 'and left Backlog in the same gesture');
    check(stacked('backlog'), 'Backlog closed the gap it left');
    check(stacked('doing'), 'In progress is still a clean stack');
    checkEqual(countsNow().doing, 3, 'the In progress count reads 3');
    await cm.undo(); H.refresh(); await settle();
    check(D.getGroup('backlog').members.has(mover) && !D.getGroup('doing').members.has(mover), 'one undo put the card back in Backlog');
    check(stacked('backlog') && stacked('doing'), 'and both columns are clean stacks again');

    // ③ reorder inside a column: drag the last Backlog card to the top
    const b0 = order('backlog');
    const last = D.getNode(b0[b0.length - 1]), first = D.getNode(b0[0]);
    await drag(center(last), { x: center(first).x, y: first.position.y + 4 });
    const b1 = order('backlog');
    checkEqual(b1[0], last.id, 'the last card is now first');
    check(stacked('backlog'), 'Backlog is a clean stack after the reorder');

    // ④ add a card into the empty column
    const w = addCard('done');
    await settle();
    check(!!w && D.getGroup('done').members.has(w.id), '"+ Add" put a card into the empty Done column');
    checkEqual(countsNow().done, 1, 'the Done count reads 1');
    // …and into a column that already holds cards: the column grows to take it
    const backlog0 = countsNow().backlog;
    const wb = addCard('backlog');
    await settle();
    for (let i = 0; i < 3; i++) await raf();
    check(!!wb && D.getGroup('backlog').members.has(wb.id), '"+ Add" puts a card into Backlog, which already holds cards');
    checkEqual(countsNow().backlog, backlog0 + 1, 'the Backlog count went up by one');
    checkEqual(order('backlog').at(-1), wb?.id, 'the new card is at the bottom of Backlog');
    check(stacked('backlog'), 'Backlog is still a clean stack');
    checkEqual(clipped().join(','), '', 'and nothing is cut off');

    // ⑥ WIP: In progress holds 3 — the third card goes in, a fourth is refused and snaps home
    const fill = order('backlog')[0];
    const doingLast = () => D.getNode(order('doing').at(-1));
    await drag(center(D.getNode(fill)), { x: center(doingLast()).x, y: doingLast().position.y + doingLast().size.height - 4 });
    check(D.getGroup('doing').members.has(fill), 'a third card goes into In progress');
    check(heads.get('doing').add.hidden, 'at its limit, In progress shows no "+ Add"');
    const extra = order('backlog')[0];
    const extraAt = { ...D.getNode(extra).position };
    const depth0 = cm.canUndo() ? 1 : 0; void depth0;
    await drag(center(D.getNode(extra)), center(doingLast()));
    check(D.getGroup('backlog').members.has(extra) && !D.getGroup('doing').members.has(extra), 'a fourth card is refused and stays in Backlog');
    checkEqual(JSON.stringify(D.getNode(extra).position), JSON.stringify(extraAt), 'and snaps back to the exact place it left');
    check(stacked('doing') && stacked('backlog'), 'both columns are clean stacks after the refusal');

    // ⑦ cards live in columns: a drop below every column is refused
    const loose = order('review')[0];
    const reviewG = D.getGroup('review');
    await drag(center(D.getNode(loose)), { x: center(D.getNode(loose)).x, y: reviewG.position.y + reviewG.size.height + 160 });
    check(reviewG.members.has(loose), 'a card dropped below the columns stays in its column');
    check([...D.getGroup(H.activeView).members].every((id) => COLUMNS.some((c) => c.id === id)), 'the board itself holds only columns');

    // ⑧ a narrower board: cards re-wrap, re-measure, and nothing is cut off
    const tallH0 = D.getNode('card-2').size.height;
    container.style.width = '760px';
    for (let i = 0; i < 6; i++) await raf();
    await new Promise((r) => setTimeout(r, 600));   // heights glide to their new size
    await settle();
    checkEqual(clipped().join(','), '', 'at 760 px no card is cut off');
    check(D.getNode('card-2').size.height > tallH0, 'the long card grew as its text re-wrapped');
    for (const c of COLUMNS) check(stacked(c.id), `${c.name}: still a clean stack at 760 px`);
    container.style.width = '';
    for (let i = 0; i < 6; i++) await raf();
    await new Promise((r) => setTimeout(r, 600));
    await settle();
    checkEqual(D.getNode('card-2').size.height, tallH0, 'back at full width the long card is its old height again');

    // ⑨ every stage carries its tint
    for (const c of COLUMNS) {
      const bg = container.querySelector(`.axdb-group-bg[data-group-bg="${c.id}"]`);
      check(!!bg && getComputedStyle(bg).backgroundColor !== 'rgba(0, 0, 0, 0)', `${c.name} has its tint`);
    }

    // ⑩ the drop ring: blue on the stage that will take the card, orange on one that refuses it
    {
      const stage = order('review').length < 2 ? 'review' : 'backlog';
      const mover = order('done')[0] ?? order('backlog')[0];
      const fromCol = COLUMNS.find((c) => D.getGroup(c.id).members.has(mover)).id;
      const tgt = D.getGroup(stage);
      const release = await hold(center(D.getNode(mover)), { x: tgt.position.x + tgt.size.width / 2, y: tgt.position.y + 60 });
      checkEqual(ring(stage), 'drop', `mid-drag, ${stage} wears the blue ring`);
      check(COLUMNS.filter((c) => c.id !== stage).every((c) => ring(c.id) === 'none'), 'and no other stage does');
      await release();
      check(COLUMNS.every((c) => ring(c.id) === 'none'), 'the ring goes on release');
      await cm.undo(); H.refresh(); await settle();
      check(D.getGroup(fromCol).members.has(mover), 'undo put the card back');
      // In progress is full (⑥): a card held over it gets the orange ring, then snaps home
      const doingG = D.getGroup('doing');
      const other = order('backlog')[0];
      const release2 = await hold(center(D.getNode(other)), { x: doingG.position.x + doingG.size.width / 2, y: doingG.position.y + 60 });
      checkEqual(ring('doing'), 'refused', 'a card over the FULL In progress gets the orange ring');
      await release2();
      check(D.getGroup('backlog').members.has(other), 'and the release snaps it home');
    }

    // ⑪ a stage only trades places with the other stages
    const order0 = stageOrder();
    checkEqual(order0.join(','), 'backlog,doing,review,done', 'stages start in their order');
    const backlogCards = [...D.getGroup('backlog').members];
    const reviewStage = D.getGroup('review');
    const releaseS = await hold(header('backlog'), { x: reviewStage.position.x + reviewStage.size.width * 0.75, y: header('backlog').y + 4 }, 16);
    await releaseS();
    checkEqual(stageOrder().join(','), 'doing,review,backlog,done', 'Backlog dragged past Review now sits after it');
    check(COLUMNS.every((c) => D.getGroup(c.id).position.y === D.getGroup('doing').position.y), 'every stage is still on the one row');
    const bg2 = D.getGroup('backlog');
    check(backlogCards.every((id) => { const n = D.getNode(id); return n.position.x >= bg2.position.x && n.position.x < bg2.position.x + bg2.size.width; }), 'its cards travelled with it');
    await cm.undo(); H.refresh(); await settle();
    checkEqual(stageOrder().join(','), order0.join(','), 'one undo puts the stage order back');

    // ⑫ a stage never drops INTO another stage or below the row
    const doneG = D.getGroup('done');
    const releaseN = await hold(header('done'), { x: D.getGroup('doing').position.x + 40, y: D.getGroup('doing').position.y + 140 }, 16);
    await releaseN();
    check([...D.getGroup(H.activeView).members].filter((id) => COLUMNS.some((c) => c.id === id)).length === 4, 'all four stages are still on the board');
    check(COLUMNS.every((c) => !COLUMNS.some((o) => o.id !== c.id && D.getGroup(o.id).members.has(c.id))), 'no stage went inside another');
    checkEqual(doneG.position.y, D.getGroup('doing').position.y, 'Done stayed on the row');
    if (stageOrder().join(',') !== order0.join(',')) { await cm.undo(); H.refresh(); await settle(); } // only a reorder made a step

    // ⑤ the board round-trips
    const snap = H.toJSON();
    check(snap.views[0].widgets.every((c) => Array.isArray(c.widgets)), 'toJSON() keeps every column with its cards');
  },

  async showcase(ctx) {
    // The money shot: a Backlog card mid-drag into In progress, the column
    // making room under the placeholder and Backlog closing its gap.
    const D = ctx.diagram;
    const container = ctx.host;
    const toClient = (wx, wy) => ctx.instance.viewport.worldToClient(wx, wy, container.getBoundingClientRect());
    const pev = (type, cx, cy) => (document.elementFromPoint(cx, cy) ?? container).dispatchEvent(new PointerEvent(type, {
      clientX: cx, clientY: cy, bubbles: true, cancelable: true, composed: true,
      pointerId: 99, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 1,
    }));
    const byY = (col) => [...D.getGroup(col).members].map((id) => D.getNode(id)).filter(Boolean).sort((a, b) => a.position.y - b.position.y);
    const card = byY('backlog')[0];
    const target = byY('doing')[1];
    const from = { x: card.position.x + card.size.width / 2, y: card.position.y + card.size.height / 2 };
    const to = { x: target.position.x + target.size.width / 2 + 24, y: target.position.y + 10 };
    const a = toClient(from.x, from.y);
    pev('pointerdown', a.x, a.y);
    for (let i = 1; i <= 10; i++) {
      const c = toClient(from.x + ((to.x - from.x) * i) / 10, from.y + ((to.y - from.y) * i) / 10);
      pev('pointermove', c.x, c.y);
      await ctx.tick(16);
    }
    ctx.instance.renderNow();
  },
});
</script>
