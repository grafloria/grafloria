<style>
  /* ================================================================================
     KANBAN STUDIO — a full team board on the dashboard kit. Lists are sections with
     `movable: 'row'` (they only trade places), `stack` (a drop lands after the last
     card) and a `background`; cards are `autoHeight` widgets painted by
     kanban-studio-card.js; `canDrop` enforces the WIP limits. Everything the board
     does comes from dashboard() options — the page paints and wires, nothing more.
     ================================================================================ */
  #stage {
    --ks-list: #f1f2f4d9; --ks-list-ink: #172b4d; --ks-list-mut: #44546f;
    --ks-card: #ffffff; --ks-card-ink: #172b4d; --ks-card-mut: #626f86; --ks-card-line: #091e4224;
    --ks-card-shadow: 0 1px 1px #091e4240, 0 0 1px #091e424f;
    --ks-hover: #091e420f; --ks-bar: #0000003d; --ks-bar-ink: #ffffff;
    --ks-overdue: #ffd5d2; --ks-overdue-ink: #ae2e24; --ks-soon: #f8e6a0; --ks-soon-ink: #7f5f01;
    --ks-ok: #1f845a; --ks-ok-ink: #ffffff; --ks-accent: #0c66e4;
    --ks-dialog: #ffffff; --ks-field: #f7f8f9; --ks-field-line: #091e4224;
    position: relative; height: calc(100vh - 96px); min-height: 600px;
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    background: #3b2a63 center / cover no-repeat;
    font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, sans-serif;
    color: var(--ks-list-ink); overflow: hidden;
  }
  #stage[data-backdrop="dusk"]   { background-image: url(kanban-studio-backdrop.svg); }
  #stage[data-backdrop="ocean"]  { background-image: linear-gradient(160deg, #0b3a67 0%, #0e6c8f 45%, #36b7b4 100%); }
  #stage[data-backdrop="meadow"] { background-image: linear-gradient(160deg, #1f5130 0%, #4e8f3c 50%, #c6d36a 100%); }
  @media (prefers-color-scheme: dark) {
    #stage {
      --ks-list: #101204cc; --ks-list-ink: #b6c2cf; --ks-list-mut: #9fadbc;
      --ks-card: #22272b; --ks-card-ink: #b6c2cf; --ks-card-mut: #9fadbc; --ks-card-line: #a6c5e229;
      --ks-card-shadow: 0 1px 1px #03040480, 0 0 1px #03040480;
      --ks-hover: #a6c5e214; --ks-bar: #00000066;
      --ks-overdue: #42221f; --ks-overdue-ink: #fd9891; --ks-soon: #533f04; --ks-soon-ink: #f5cd47;
      --ks-dialog: #323940; --ks-field: #22272b; --ks-field-line: #a6c5e229; --ks-accent: #579dff;
    }
  }

  /* ---- the board bar, frosted over the backdrop ------------------------------ */
  .ks-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px;
    background: var(--ks-bar); color: var(--ks-bar-ink); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ks-name { font-size: 18px; font-weight: 700; padding: 2px 8px; border-radius: 4px; border: 0; background: transparent; color: inherit;
    font-family: inherit; min-width: 4ch; max-width: 40ch; }
  .ks-name:hover, .ks-name:focus { background: #ffffff33; outline: none; }
  .ks-ibtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 4px;
    background: #ffffff33; color: inherit; font: inherit; font-weight: 500; cursor: pointer; }
  .ks-ibtn:hover { background: #ffffff4d; }
  .ks-ibtn[aria-pressed="true"] { background: #ffffffe6; color: #172b4d; }
  .ks-ibtn:disabled { opacity: .45; cursor: default; }
  .ks-star { font-size: 16px; padding: 0 8px; }
  .ks-star[aria-pressed="true"] { background: #ffffff33; color: #f5cd47; }
  .ks-sp { flex: 1; }
  .ks-team { display: inline-flex; padding-left: 6px; }
  .ks-team .ks-av { margin-left: -6px; box-shadow: 0 0 0 2px #ffffffb3; cursor: pointer; }
  .ks-team .ks-av[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ks-accent); }
  .ks-filters { display: inline-flex; gap: 4px; }
  .ks-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; background: var(--c); cursor: pointer; padding: 0; }
  .ks-dot[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--c); }
  .ks-search { height: 32px; width: 180px; padding: 0 10px; border-radius: 4px; border: 0; background: #ffffff33; color: inherit; font: inherit; }
  .ks-search::placeholder { color: #ffffffb3; }
  .ks-search:focus { background: #ffffff; color: #172b4d; outline: none; }
  .ks-match { font-size: 12px; opacity: .9; min-width: 7ch; font-variant-numeric: tabular-nums; }
  .ks-bd { display: inline-flex; gap: 4px; }
  .ks-bd button { width: 28px; height: 20px; border-radius: 3px; border: 2px solid transparent; cursor: pointer; padding: 0; background: center / cover; }
  .ks-bd button[aria-pressed="true"] { border-color: #fff; }

  /* ---- the board scrolls sideways like any wide board ----------------------- */
  .ks-scroll { overflow: auto hidden; min-height: 0; }
  #canvas { height: 100%; min-width: 100%; }
  #canvas, #canvas .grafloria-html-layer { background: transparent !important; }
  /* Lists are frosted glass over the backdrop: translucent (the --ks-list tint the kit paints) and blurred. */
  #stage .axdb-group-bg { backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); border-radius: 12px; }
  #stage .axdb-slab { border-radius: 12px; }

  /* ---- a list's header (painted into the section's caption band) ------------ */
  .ks-head { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 6px 0 12px; cursor: grab;
    font-weight: 600; color: var(--ks-list-ink); white-space: nowrap; overflow: hidden; }
  .ks-head .ks-hname { overflow: hidden; text-overflow: ellipsis; }
  .ks-head .ks-count { font-weight: 500; color: var(--ks-list-mut); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ks-head .ks-count.ks-full { color: var(--ks-overdue-ink); font-weight: 700; }
  .ks-head button { margin-left: auto; flex: none; width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent;
    color: var(--ks-list-mut); font-size: 18px; line-height: 1; cursor: pointer; }
  .ks-head button:hover { background: var(--ks-hover); color: var(--ks-list-ink); }

  /* ---- a card ---------------------------------------------------------------- */
  .grafloria-node-host .ks-card { box-sizing: border-box; margin: 0 8px; border-radius: 8px; background: var(--ks-card); color: var(--ks-card-ink);
    box-shadow: var(--ks-card-shadow); overflow: hidden; cursor: pointer; }
  .grafloria-node-host:hover .ks-card { outline: 2px solid var(--ks-accent); outline-offset: -2px; }
  .grafloria-node-host.ks-dim { opacity: .28; }
  .ks-cover { height: 32px; }
  .ks-body { padding: 8px 12px 6px; display: grid; gap: 4px; }
  .ks-labels { display: flex; flex-wrap: wrap; gap: 4px; }
  .ks-label { font-size: 12px; line-height: 16px; font-weight: 500; padding: 0 8px; border-radius: 4px; background: var(--c); color: #1d2125; }
  .ks-title { font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
  .ks-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-top: 2px; }
  .ks-badges { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; color: var(--ks-card-mut); font-size: 12px; }
  .ks-badge { display: inline-flex; align-items: center; gap: 3px; height: 22px; border-radius: 3px; font-variant-numeric: tabular-nums; }
  .ks-due { padding: 0 4px; }
  .ks-due--overdue { background: var(--ks-overdue); color: var(--ks-overdue-ink); }
  .ks-due--soon { background: var(--ks-soon); color: var(--ks-soon-ink); }
  .ks-due--done, .ks-check--done { background: var(--ks-ok); color: var(--ks-ok-ink); padding: 0 4px; }
  .ks-people { margin-left: auto; display: inline-flex; gap: 2px; }
  .ks-av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff;
    font-size: 10px; font-weight: 700; flex: none; }

  /* ---- the card dialog -------------------------------------------------------- */
  .ks-shade { position: absolute; inset: 0; z-index: 50; background: #091e427d; display: grid; justify-items: center;
    align-items: start; overflow: auto; padding: 40px 16px; }
  .ks-dialog { position: relative; width: min(720px, 100%); background: var(--ks-dialog); color: var(--ks-card-ink);
    border-radius: 12px; box-shadow: 0 8px 32px #091e4247; overflow: hidden; }
  .ks-dlg-cover { height: 96px; }
  .ks-dlg-x { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: #091e420f; color: inherit; font-size: 22px; cursor: pointer; }
  .ks-dlg-head { padding: 20px 56px 4px 24px; }
  .ks-dlg-title { width: 100%; box-sizing: border-box; resize: none; border: 0; border-radius: 4px; padding: 4px 8px; margin-left: -8px;
    background: transparent; color: inherit; font-family: inherit; font-size: 20px; font-weight: 600; line-height: 28px; }
  .ks-dlg-title:focus { background: var(--ks-field); outline: 2px solid var(--ks-accent); }
  .ks-dlg-where { font-size: 12px; color: var(--ks-card-mut); }
  .ks-dlg-grid { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 24px; padding: 8px 24px 24px; }
  @media (max-width: 640px) { .ks-dlg-grid { grid-template-columns: minmax(0, 1fr); } }
  .ks-dlg-sec { display: grid; gap: 8px; margin-bottom: 16px; }
  .ks-dlg-sec h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ks-card-mut); letter-spacing: .02em; }
  .ks-dlg-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ks-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--ks-field-line); background: var(--ks-field); color: inherit; font: inherit; font-size: 13px; }
  .ks-chip--label { border-left: 8px solid var(--c); }
  .ks-chip[aria-pressed="true"] { border-color: var(--ks-accent); box-shadow: inset 0 0 0 1px var(--ks-accent); font-weight: 600; }
  .ks-chip--label[aria-pressed="true"] { border-left-color: var(--c); }
  .ks-dlg-desc, .ks-dlg-select, .ks-dlg-add input { box-sizing: border-box; width: 100%; border: 1px solid var(--ks-field-line); border-radius: 4px;
    background: var(--ks-field); color: inherit; font: inherit; padding: 8px 10px; }
  .ks-dlg-desc { resize: vertical; min-height: 88px; }
  .ks-dlg-bar { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--ks-card-mut); }
  .ks-dlg-track { height: 8px; border-radius: 4px; background: var(--ks-field-line); overflow: hidden; }
  .ks-dlg-track > span { display: block; height: 100%; background: var(--ks-accent); transition: width .2s; }
  .ks-dlg-bar--done .ks-dlg-track > span { background: var(--ks-ok); }
  .ks-dlg-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .ks-dlg-items li { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 4px; }
  .ks-dlg-items li:hover { background: var(--ks-hover); }
  .ks-dlg-items input { width: 16px; height: 16px; accent-color: var(--ks-accent); }
  .ks-dlg-items .ks-done { text-decoration: line-through; color: var(--ks-card-mut); }
  .ks-dlg-add { display: flex; gap: 8px; }
  .ks-btn { height: 32px; padding: 0 12px; border-radius: 4px; border: 0; background: var(--ks-accent); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  .ks-btn--danger { background: #c9372c; width: 100%; }
  .ks-dlg-done { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .ks-dlg-hint { margin: 0; font-size: 12px; color: var(--ks-card-mut); }
  :is(.ks-ibtn, .ks-dot, .ks-chip, .ks-btn, .ks-head button, .ks-dlg-x, .ks-bd button):focus-visible { outline: 2px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 4px var(--ks-accent); }

  /* ---- the toast --------------------------------------------------------------- */
  .ks-toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: flex; gap: 12px; align-items: center;
    padding: 10px 14px; border-radius: 8px; background: #172b4d; color: #fff; box-shadow: 0 8px 24px #091e4259; font-size: 13px;
    pointer-events: none; }   /* a toast never swallows a drop on the list under it… */
  .ks-toast button { pointer-events: auto; /* …only its action takes a click */ border: 0; background: transparent; color: #85b8ff; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .ks-dlg-track > span { transition: none; } }
</style>

<div id="demo-head"></div>
<div id="stage" data-backdrop="dusk">
  <div class="ks-bar">
    <input class="ks-name" id="ks-name" aria-label="Board name">
    <button class="ks-ibtn ks-star" id="ks-star" type="button" aria-pressed="true" title="Star this board">★</button>
    <span class="ks-team" id="ks-team" aria-label="Filter by member"></span>
    <span class="ks-filters" id="ks-filters" aria-label="Filter by label"></span>
    <input class="ks-search" id="ks-search" type="search" placeholder="Search cards" aria-label="Search cards">
    <span class="ks-match" id="ks-match" aria-live="polite"></span>
    <span class="ks-sp"></span>
    <button class="ks-ibtn" id="ks-undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
    <button class="ks-ibtn" id="ks-redo" type="button" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <span class="ks-bd" id="ks-bd" aria-label="Board background"></span>
  </div>
  <div class="ks-scroll" id="ks-scroll"><div id="canvas"></div></div>
</div>

<script type="module">
import { render, dashboard } from '../shell/grafloria.js';
import { defineDemo, check, checkEqual } from '../shell/demo.js?v=drawer4';
import { BOARD_NAME, LABELS, MEMBERS, LISTS, CARDS, NEW_CARD_TITLES } from './kanban-studio-data.js';
import { paintCard, openDetails, matches, avatar } from './kanban-studio-card.js';

const ROW = 4, GAP = 8;          // a small row unit: a card rounds up by at most 12 px
const HEAD_ROWS = 4;             // the list header: 4 × (ROW + GAP) = 48 px
const LIST_W = 272;              // a list's width, px
let EMPTY_ROWS = 40;             // a list reaches down the board, so there is always room below its last card (set from the board height)
const GUESS = 8;                 // a card's first-guess rows; autoHeight measures it
const ctx = { labels: LABELS, members: MEMBERS };
const stage = document.getElementById('stage');

let H, api, seq = 0;
const cardSpec = (d) => ({ id: `c${++seq}`, kind: 'card', span: 1, rows: GUESS, resizable: false, data: structuredClone(d) });
const dataOf = (id) => H.widget(id)?.spec.data;

/* ---- counts, WIP and the drop policy --------------------------------------------- */
const cardsIn = (listId) => (H?.toJSON().views[0].widgets.find((w) => w.id === listId)?.widgets ?? []).map((w) => w.id);
const isFull = (listId) => { const l = LISTS.find((x) => x.id === listId); return !!l?.wip && cardsIn(listId).length >= l.wip; };
let lastRefusal = 0;
function canDrop({ to }) {
  if (!LISTS.some((l) => l.id === to)) return false;                 // cards live in lists
  if (!isFull(to)) return true;
  if (Date.now() - lastRefusal > 1500) { lastRefusal = Date.now(); toast(`${LISTS.find((l) => l.id === to).name} holds ${LISTS.find((l) => l.id === to).wip} cards — finish one first`); }
  return false;
}
const heads = new Map();
function paintHead(listId, host) {
  const list = LISTS.find((l) => l.id === listId);
  if (!list) return;
  const head = document.createElement('div'); head.className = 'ks-head';
  const name = document.createElement('span'); name.className = 'ks-hname'; name.textContent = list.name;
  const count = document.createElement('span'); count.className = 'ks-count';
  const add = document.createElement('button'); add.type = 'button'; add.textContent = '+'; add.dataset.axdbPass = '';
  add.title = `Add a card to ${list.name}`; add.setAttribute('aria-label', add.title);
  add.addEventListener('click', (e) => { e.stopPropagation(); addCard(list.id); });
  head.append(name, count, add);
  host.replaceChildren(head);
  heads.set(listId, { count, add });
  refreshCounts();
}
function refreshCounts() {
  if (!H) return;
  for (const l of LISTS) {
    const h = heads.get(l.id);
    if (!h) continue;
    const n = cardsIn(l.id).length;
    const full = !!l.wip && n >= l.wip;
    h.count.textContent = l.wip ? `${n} / ${l.wip}` : String(n);
    h.count.classList.toggle('ks-full', full);
    h.count.title = l.wip ? `Work-in-progress limit: ${l.wip}` : '';
    h.add.hidden = full;                         // a full list takes no new card; the count says why
  }
  applyFilter();
}

/* ---- filter: dims what does not match (the layout never jumps) ------------------- */
const filter = { labels: new Set(), members: new Set(), text: '' };
function applyFilter() {
  if (!H) return;
  const on = filter.labels.size || filter.members.size || filter.text;
  let shown = 0, total = 0;
  for (const l of LISTS) for (const id of cardsIn(l.id)) {
    total++;
    const ok = !on || matches(dataOf(id), filter);
    if (ok) shown++;
    document.querySelector(`.grafloria-node-host[data-node-id="${id}"]`)?.classList.toggle('ks-dim', !ok);
  }
  document.getElementById('ks-match').textContent = on ? `${shown} of ${total}` : '';
}

/* ---- add, edit, delete ----------------------------------------------------------- */
function addCard(listId) {
  if (isFull(listId)) return undefined;
  const w = H.addWidget(cardSpec({ title: NEW_CARD_TITLES[seq % NEW_CARD_TITLES.length], labels: [], members: [] }), listId);
  refreshCounts();
  if (w) toast('Card added — click it to fill it in');
  return w;
}
let dialog = null;
function openCard(id) {
  const d = dataOf(id);
  if (!d) return;
  const listId = LISTS.find((l) => cardsIn(l.id).includes(id))?.id;
  dialog?.close();
  dialog = openDetails(stage, d, ctx, {
    listName: LISTS.find((l) => l.id === listId)?.name ?? '',
    onChange: (next) => { H.widget(id)?.update({ data: next }); applyFilter(); },   // repaint → autoHeight re-measures
    onDelete: () => { H.widget(id)?.remove(); refreshCounts(); toast('Card deleted', 'Undo', undo); },
  });
}
// A click on a card (press and release in place) opens it; a drag never does.
let press = null;
document.getElementById('canvas').addEventListener('pointerdown', (e) => {
  const host = e.target.closest?.('.grafloria-node-host');
  press = host && e.target.closest('[data-card]') ? { id: host.dataset.nodeId, x: e.clientX, y: e.clientY } : null;
}, true);
window.addEventListener('pointerup', (e) => {
  const p = press; press = null;
  if (p && Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y) < 5) openCard(p.id);
}, true);

/* ---- undo, toast ----------------------------------------------------------------- */
const cmd = () => api.getEngine().commandManager;
async function undo() { if (cmd().canUndo()) { await cmd().undo(); refreshCounts(); } syncUndo(); }
async function redo() { if (cmd().canRedo()) { await cmd().redo(); refreshCounts(); } syncUndo(); }
function syncUndo() {
  document.getElementById('ks-undo').disabled = !cmd().canUndo();
  document.getElementById('ks-redo').disabled = !cmd().canRedo();
}
let toastTimer = 0;
function toast(text, action, fn) {
  stage.querySelector('.ks-toast')?.remove();
  const t = document.createElement('div'); t.className = 'ks-toast'; t.setAttribute('role', 'status');
  t.append(Object.assign(document.createElement('span'), { textContent: text }));
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action; b.addEventListener('click', () => { fn(); t.remove(); }); t.append(b); }
  stage.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 4000);
}

/* ---- the board bar ----------------------------------------------------------------- */
function buildBar() {
  const name = document.getElementById('ks-name');
  name.value = BOARD_NAME;
  name.size = Math.max(4, name.value.length);
  name.addEventListener('input', () => { name.size = Math.max(4, name.value.length); });
  const star = document.getElementById('ks-star');
  star.addEventListener('click', () => star.setAttribute('aria-pressed', String(star.getAttribute('aria-pressed') !== 'true')));
  const team = document.getElementById('ks-team');
  for (const m of MEMBERS) {
    const a = avatar(m); a.setAttribute('role', 'button'); a.tabIndex = 0; a.setAttribute('aria-pressed', 'false');
    a.title = `Show ${m.name}'s cards`;
    const toggle = () => { filter.members.has(m.id) ? filter.members.delete(m.id) : filter.members.add(m.id); a.setAttribute('aria-pressed', String(filter.members.has(m.id))); applyFilter(); };
    a.addEventListener('click', toggle);
    a.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    team.append(a);
  }
  const dots = document.getElementById('ks-filters');
  for (const l of LABELS) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ks-dot'; b.style.setProperty('--c', l.color);
    b.title = `Show ${l.name} cards`; b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', 'false'); b.dataset.label = l.id;
    b.addEventListener('click', () => { filter.labels.has(l.id) ? filter.labels.delete(l.id) : filter.labels.add(l.id); b.setAttribute('aria-pressed', String(filter.labels.has(l.id))); applyFilter(); });
    dots.append(b);
  }
  document.getElementById('ks-search').addEventListener('input', (e) => { filter.text = e.target.value.trim(); applyFilter(); });
  document.getElementById('ks-undo').addEventListener('click', undo);
  document.getElementById('ks-redo').addEventListener('click', redo);
  const bd = document.getElementById('ks-bd');
  const BACKDROPS = [['dusk', 'Dusk', 'url(kanban-studio-backdrop.svg)'], ['ocean', 'Ocean', 'linear-gradient(160deg, #0b3a67, #36b7b4)'], ['meadow', 'Meadow', 'linear-gradient(160deg, #1f5130, #c6d36a)']];
  let saved = 'dusk';
  try { saved = localStorage.getItem('ks-backdrop') || 'dusk'; } catch { /* storage may be blocked */ }
  for (const [key, label, bg] of BACKDROPS) {
    const b = document.createElement('button'); b.type = 'button'; b.title = `${label} background`; b.setAttribute('aria-label', b.title);
    b.style.backgroundImage = bg; b.dataset.backdrop = key;
    b.addEventListener('click', () => setBackdrop(key));
    bd.append(b);
  }
  const setBackdrop = (key) => {
    stage.dataset.backdrop = key;
    for (const b of bd.children) b.setAttribute('aria-pressed', String(b.dataset.backdrop === key));
    try { localStorage.setItem('ks-backdrop', key); } catch { /* fine without */ }
  };
  setBackdrop(BACKDROPS.some(([k]) => k === saved) ? saved : 'dusk');
  window.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z' || stage.querySelector('.ks-shade')) return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
    e.preventDefault(); (e.shiftKey ? redo : undo)();
  });
}

/* ---- the board ------------------------------------------------------------------- */
function buildSpec() {
  return dashboard({
    columns: LISTS.length,
    gap: GAP,
    sizing: 'grow',
    rowHeight: ROW,
    float: false,
    autoHeight: true,
    canDrop,
    widgets: LISTS.map((l) => {
      const inner = Math.max(EMPTY_ROWS, CARDS[l.id].length * GUESS);
      return {
        id: l.id, title: l.name, span: 1, rows: inner + HEAD_ROWS, columns: 1, maxRows: EMPTY_ROWS,
        pinned: true, movable: 'row', resizable: false, stack: true, background: 'var(--ks-list)',
        caption: { text: l.name, height: HEAD_ROWS * (ROW + GAP), background: 'transparent' },
        widgets: CARDS[l.id].map(cardSpec),
      };
    }),
    renderWidget: (w, host) => { if (w.kind === 'card') paintCard(host, w.data, ctx); },
    renderCaption: (w, host) => paintHead(w.id, host),
    onLayoutChange: () => { refreshCounts(); syncUndo(); },
  });
}

defineDemo({
  name: 'Kanban studio',
  blurb: 'A team board built entirely from dashboard() options. Lists are sections that only trade places with each other (movable: \'row\'), keep their cards in order (stack) and carry a tint (background); cards are autoHeight widgets with labels, due dates, checklists and people; canDrop holds the work-in-progress limits. Click a card to edit it — the card grows and shrinks with what you write. Filter by label, person or text; switch the backdrop; undo anything.',
  howTo: [
    'Drag a card to another list: the list it will land in gets a blue ring. "In progress" holds 4 and "In review" 3 — a full list rings orange, refuses the card and says why.',
    'Drag a list by its header to reorder the lists. A list never drops into another list.',
    'Click a card to open it: add a checklist item, tick items, write a description, change labels or the due date. The card resizes as you go.',
    'Use the coloured dots, the avatars or the search box to filter: cards that do not match fade out.',
    'Press + on a list to add a card, Undo to take any change back, and pick a background on the right of the bar.',
  ],

  async setup(c) {
    buildBar();
    const canvas = document.getElementById('canvas');
    canvas.style.width = `${LISTS.length * (LIST_W + GAP) + GAP}px`;
    // Lists run to just above the bottom edge: the board's height in rows, less the header and a margin.
    EMPTY_ROWS = Math.max(20, Math.floor((canvas.clientHeight - 2 * GAP - 24) / (ROW + GAP)) - HEAD_ROWS);
    const spec = buildSpec();
    api = render(spec, c.host);
    H = spec.handle;
    c.instance = api; c.diagram = api.getModel(); c.handle = H;
    window.__lab = { H, api, D: c.diagram };   // the e2e probes read the live board
    api.renderNow();
    await c.tick();
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    refreshCounts();
    syncUndo();
  },

  async assert(c) {
    const D = c.diagram;
    const cm = cmd();
    const container = c.host;
    const settle = async () => { c.instance.renderNow(); await c.tick(); };
    const raf = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const toClient = (wx, wy) => c.instance.viewport.worldToClient(wx, wy, container.getBoundingClientRect());
    let PID = 70;
    const pev = (type, cx, cy) => (document.elementFromPoint(cx, cy) ?? container).dispatchEvent(new PointerEvent(type, {
      clientX: cx, clientY: cy, bubbles: true, cancelable: true, composed: true,
      pointerId: PID, pointerType: 'mouse', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1,
    }));
    const hold = async (from, to, steps = 12) => {
      PID++;
      const a = toClient(from.x, from.y); pev('pointerdown', a.x, a.y);
      for (let i = 1; i <= steps; i++) { const p = toClient(from.x + ((to.x - from.x) * i) / steps, from.y + ((to.y - from.y) * i) / steps); pev('pointermove', p.x, p.y); await raf(); }
      return async () => { const p = toClient(to.x, to.y); pev('pointerup', p.x, p.y); await settle(); };
    };
    const drag = async (from, to) => (await hold(from, to))();
    const centre = (n) => ({ x: n.position.x + n.size.width / 2, y: n.position.y + n.size.height / 2 });
    const order = (list) => [...D.getGroup(list).members].map((id) => D.getNode(id)).filter(Boolean).sort((a, b) => a.position.y - b.position.y).map((n) => n.id);
    const ring = (id) => { const e = container.querySelector(`.axdb-slab[data-slab-id="${id}"]`); return e?.classList.contains('axdb-slab--refused') ? 'refused' : e?.classList.contains('axdb-slab--drop') ? 'drop' : 'none'; };
    const clipped = () => [...container.querySelectorAll('.grafloria-node-host .ks-card')].filter((e) => e.offsetHeight > e.parentElement.clientHeight + 1).length;
    const listOrder = () => LISTS.map((l) => D.getGroup(l.id)).sort((a, b) => a.position.x - b.position.x).map((g) => g.id).join(',');
    const clickCard = async (id) => {
      const host = container.querySelector(`.grafloria-node-host[data-node-id="${id}"] .ks-title`);
      const r = host.getBoundingClientRect();
      PID++; pev('pointerdown', r.x + 10, r.y + 6); pev('pointerup', r.x + 10, r.y + 6); await settle();
    };
    await settle();

    // ① the board
    checkEqual(listOrder(), 'backlog,todo,doing,review,done', 'five lists, in order');
    checkEqual(LISTS.reduce((n, l) => n + cardsIn(l.id).length, 0), 15, 'fifteen cards');
    checkEqual(clipped(), 0, 'no card is cut off');
    check(LISTS.every((l) => container.querySelector(`.axdb-group-bg[data-group-bg="${l.id}"]`)), 'every list paints its surface');
    check(getComputedStyle(stage).backgroundImage.includes('kanban-studio-backdrop.svg'), 'the dusk backdrop is on');

    // ② filters fade what does not match, and never move anything
    const posBefore = JSON.stringify(cardsIn('doing').map((id) => D.getNode(id).position));
    document.querySelector('.ks-dot[data-label="bug"]').click();
    const dimmed = container.querySelectorAll('.grafloria-node-host.ks-dim').length;
    checkEqual(dimmed, 13, 'the Bug filter fades the 13 cards without that label');
    checkEqual(JSON.stringify(cardsIn('doing').map((id) => D.getNode(id).position)), posBefore, 'and nothing moved');
    document.querySelector('.ks-dot[data-label="bug"]').click();
    const search = document.getElementById('ks-search');
    search.value = 'page'; search.dispatchEvent(new Event('input'));
    checkEqual(document.getElementById('ks-match').textContent, '2 of 15', 'searching "page" matches two cards');
    search.value = ''; search.dispatchEvent(new Event('input'));
    checkEqual(container.querySelectorAll('.grafloria-node-host.ks-dim').length, 0, 'clearing the filters shows every card');

    // ③ a card opens on click, and grows with what is written in it
    const target = cardsIn('backlog')[1];                 // "Pricing page A/B test plan": no checklist yet
    const h0 = D.getNode(target).size.height;
    await clickCard(target);
    const dlg = stage.querySelector('.ks-dialog');
    check(!!dlg, 'clicking a card opens its details');
    const addIn = dlg.querySelector('#ks-dlg-add-item');
    for (const t of ['Write the hypothesis', 'Pick the metric', 'Set the sample size']) { addIn.value = t; dlg.querySelector('.ks-dlg-add').requestSubmit(); }
    dlg.querySelector('#ks-item-0').click();
    const title = dlg.querySelector('#ks-dlg-title');
    title.value = 'Pricing page A/B test plan: monthly-first against annual-first, two full weeks, decided on paid conversions';
    title.dispatchEvent(new Event('change'));
    const desc = dlg.querySelector('#ks-dlg-desc');
    desc.value = 'Two variants: monthly-first and annual-first. Run for two full weeks.'; desc.dispatchEvent(new Event('change'));
    dlg.querySelector('.ks-dlg-x').click();
    for (let i = 0; i < 4; i++) await raf();
    await settle();
    check(!stage.querySelector('.ks-dialog'), 'the close button closes it');
    const face = container.querySelector(`.grafloria-node-host[data-node-id="${target}"] .ks-check`);
    checkEqual(face?.textContent, '1/3', 'the card shows its new checklist, 1 of 3 done');
    check(D.getNode(target).size.height > h0 + 20, 'and grew to fit its longer title (autoHeight)');
    checkEqual(clipped(), 0, 'still nothing cut off');
    check(order('backlog').every((id, i, a) => i === 0 || D.getNode(id).position.y >= D.getNode(a[i - 1]).position.y + D.getNode(a[i - 1]).size.height), 'the cards below made room');

    // ④ moving cards: the ring says where; a full list refuses
    const mover = cardsIn('todo')[0];
    const doingG = D.getGroup('doing');
    const into = { x: doingG.position.x + doingG.size.width / 2, y: doingG.position.y + doingG.size.height - 40 };
    const release = await hold(centre(D.getNode(mover)), into);
    checkEqual(ring('doing'), 'drop', 'mid-drag, In progress wears the blue ring');
    await release();
    check(D.getGroup('doing').members.has(mover), 'the card moved into In progress');
    checkEqual(heads.get('doing').count.textContent, '4 / 4', 'which is now full');
    checkEqual(order('doing').at(-1), mover, 'dropped low, it landed after the last card (stack)');
    const extra = cardsIn('todo')[0];
    const release2 = await hold(centre(D.getNode(extra)), into);
    checkEqual(ring('doing'), 'refused', 'another card over the full list gets the orange ring');
    await release2();
    check(D.getGroup('todo').members.has(extra), 'and goes back to To do');
    check(!!stage.querySelector('.ks-toast'), 'the board says why');
    await undo();
    check(D.getGroup('todo').members.has(mover), 'Undo puts the first move back');

    // ⑤ lists only trade places
    const backlog = D.getGroup('backlog'), review = D.getGroup('review');
    await (await hold({ x: backlog.position.x + 30, y: backlog.position.y + 20 }, { x: review.position.x + review.size.width * 0.75, y: backlog.position.y + 24 }, 16))();
    checkEqual(listOrder(), 'todo,doing,review,backlog,done', 'Backlog dragged by its header now sits after In review');

    const before = cardsIn('done').length;
