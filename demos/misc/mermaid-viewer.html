<meta charset="utf-8">
<title>Mermaid viewer — Grafloria</title>
<meta name="description" content="Paste or pick a Mermaid diagram and see how Grafloria renders it.">
<link rel="canonical" href="https://grafloria.com/demos/misc/mermaid-viewer.html">

<meta property="og:description" content="Paste or pick a Mermaid diagram and see how Grafloria renders it.">
<meta property="og:url" content="https://grafloria.com/demos/misc/mermaid-viewer.html">

<style>
  #bar { display: flex; gap: 10px; padding: 8px 24px; border-bottom: 1px solid rgba(127,127,127,.25); align-items: center; flex-wrap: wrap; }
  #bar select, #bar button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(127,127,127,.4); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #status { margin-left: auto; font: 12px ui-monospace, monospace; opacity: .8; }
  #status.bad { color: #c0392b; opacity: 1; }
  #split { display: flex; height: calc(100vh - 150px); }
  #stage { flex: 1.4; min-width: 0; }
  #src { flex: 1; min-width: 0; border-left: 1px solid rgba(127,127,127,.25); }
  #src textarea { width: 100%; height: 100%; box-sizing: border-box; border: 0; padding: 10px 14px; font: 12px/1.5 ui-monospace, Menlo, monospace; resize: none; color: inherit; background: transparent; }
</style>
<header id="demo-head"></header>
<div id="bar">
  <label>diagram
    <select id="type">
      <option value="flowchart">Flowchart (shapes + style)</option>
      <option value="flowchart-fancy">Flowchart (subgraph + status)</option>
      <option value="er">Entity-Relationship</option>
      <option value="class">Class diagram</option>
      <option value="state">State diagram</option>
      <option value="sequence">Sequence (unsupported)</option>
    </select>
  </label>
  <button id="apply">apply text → diagram</button>
  <span id="status">—</span>
</div>
<div id="split">
  <div id="stage"></div>
  <div id="src"><textarea id="text" spellcheck="false"></textarea></div>
</div>
<script type="module">
import { render, importDiagramText, exportDiagramText } from '../shell/grafloria.js';
import { defineDemo, check } from '../shell/demo.js?v=drawer4';
import { mountCodeEditor } from '../shell/code-editor.js';

// A live viewer for Grafloria's Mermaid support: pick a diagram type, see how Grafloria
// renders it, edit the source and re-apply. Honest about current coverage —
// flowcharts (Phase 0-2) render fully; ER / class / state are the Phase-3 work
// in progress, and unsupported types report themselves rather than blanking.
const EXAMPLES = {
  flowchart: `flowchart TD
  Start([Start]) --> Load[(Fetch data)]
  Load --> Check{Valid?}
  Check -->|yes| Save[[Persist]]
  Check -->|no| Start
  Save --> Done((Done))
  style Start fill:#c8e6c9,stroke:#2e7d32
  style Done fill:#bbdefb,stroke:#1565c0
  classDef warn fill:#ffe0b2,stroke:#e65100
  class Check warn`,
  'flowchart-fancy': `flowchart LR
  subgraph pipeline
    Extract --> Transform --> Load
  end
  Load --> Warehouse[(Warehouse)]
  Trigger --> Extract
  %%grafloria:node Transform status:running
  %%grafloria:edge Transform Load animation:marching-ants`,
  er: `erDiagram
  CUSTOMER ||--o{ ORDER : places
  ORDER ||--|{ LINE_ITEM : contains
  CUSTOMER {
    string name
    string email
  }`,
  class: `classDiagram
  class Animal {
    +int age
    +String name
    +bark() void
  }
  class Dog
  class Cat
  Animal <|-- Dog
  Animal <|-- Cat`,
  state: `stateDiagram-v2
  [*] --> Still
  Still --> Moving
  Moving --> Still
  Moving --> Crash
  Crash --> [*]`,
  sequence: `sequenceDiagram
  Alice->>Bob: Hello Bob
  Bob-->>Alice: Hi Alice`,
};

// The parser hands back a real DiagramModel, and `setNodes`/`setEdges` accept
// live models (`NodeInput = NodeSpec | NodeModel`) — so hand them straight over.
//
// This used to project the model down to a {id,label,position,size,shape,style}
// tuple, which quietly THREW AWAY everything not on that list. The edge labels
// were one casualty. `dslShape` and `dslStyled` were the others, and they only
// show up once the diagram is exported back to text: without them the generator
// falls back to plain rectangles and drops every `style` line, so a round trip
// silently degraded `Start([Start])` into `Start[Start]` and washed the colours
// out of the source. Carrying the model itself is the fix that has no next
// casualty.
const modelParts = (model) => ({ nodes: model.getNodes(), edges: model.getLinks() });

defineDemo({
  name: 'Mermaid viewer',
  blurb: 'Paste or pick a Mermaid diagram and see how Grafloria renders it. Flowcharts render fully (shapes, colours, subgraphs, node status); ER / class / state are in progress; unsupported types report themselves instead of blanking.',
  howTo: [
    'Pick a diagram type from the dropdown — the source loads on the left-of-text and Grafloria renders it on the canvas.',
    'Edit the Mermaid source in the text pane and click "apply text → diagram" to re-render your changes.',
    'It round-trips BOTH ways: click a node or an edge on the canvas and press Delete — the Mermaid source rewrites itself to match, so the text never drifts from the drawing.',
    'Try "Sequence (unsupported)": the status line names it as unsupported rather than drawing a broken diagram — that is the safe-failure guarantee.',
    'Compare the Flowchart examples: shapes, style/classDef colours, subgraphs and %%grafloria node-status all render — this is the Mermaid compatibility built in Phases 0-2.',
  ],

  async setup(ctx) {
    const stage = document.getElementById('stage');
    const ta = document.getElementById('text');
    // Syntax-coloured source. The textarea stays canonical underneath, so the
    // reads below (and the scripted checks) are unchanged; only the programmatic
    // WRITES go through the editor so both surfaces stay in step.
    const ed = await mountCodeEditor(ta, { language: 'mermaid' });
    ctx.editor = ed;
    const sel = document.getElementById('type');
    const status = document.getElementById('status');
    let api = null;

    // ROUND TRIP — text is not the only source of truth.
    // Editing the CANVAS (delete a node, delete an edge) regenerates the Mermaid
    // source, so the pane can never drift from what is actually drawn. The pane
    // is for reading, so `lossless:false`: plain Mermaid, not the sidecar comment
    // the on-disk format carries.
    let applying = false;                      // text → diagram in flight
    const syncTextFromDiagram = () => {
      if (applying || !api) return;
      ed.setValue(exportDiagramText(api.getModel(), { lossless: false }).replace(/\n+$/, '\n'));
      countStatus();
    };

    const countStatus = () => {
      const m = api?.getModel();
      if (!m) return;
      status.className = '';
      status.textContent = `${m.getNodes().length} nodes · ${m.getLinks().length} links`;
    };

    const renderText = (text) => {
      applying = true;
      try {
        const r = importDiagramText(text);
        status.className = '';
        if (r.unsupported) {
          status.className = 'bad';
          status.textContent = `unsupported diagram type: ${r.unsupported}`;
          if (api) { api.setNodes([]); api.setEdges([]); api.renderNow(); }
          return r;
        }
        const parts = modelParts(r.diagram);
        if (!api) {
          api = render(parts, stage);
          ctx.instance = api;
          // Subscribed ONCE, at creation. Both fire on add and on remove.
          api.on('nodes:change', syncTextFromDiagram);
          api.on('edges:change', syncTextFromDiagram);
        } else {
          // Clear first. The reconciler treats a live model as "already here" and
          // leaves the existing object alone, so re-applying edited text would
          // otherwise keep the STALE nodes for every id that still exists.
          api.setEdges([]);
          api.setNodes([]);
          api.setNodes(parts.nodes);
          api.setEdges(parts.edges);
        }
        api.renderNow();
        api.fitView?.(40);
        countStatus();
        return r;
      } finally {
        applying = false;
      }
    };

    // The canvas-side edit that drives the round trip. Scoped away from the text
    // pane on purpose: Backspace inside Monaco must delete a CHARACTER, never a
    // selected node.
    // THROUGH THE COMMAND STACK, as one undoable step — never `model.removeNode`
    // directly. Mutating the model behind the command manager's back does not
    // just lose the undo: it leaves the stack pointing at entities that no
    // longer exist, so the NEXT Ctrl+Z throws ("Node Start not found") on a
    // command that has nothing to do with the delete. The canvas' own Delete
    // handler learned this already; this handler shadows it (window capture +
    // stopImmediatePropagation) and so has to do the same thing.
    const deleteSelection = async () => {
      const m = api?.getModel();
      if (!m) return 0;
      const links = m.getLinks().filter((l) => l.state === 'selected');
      const nodes = m.getSelectedNodes?.() ?? [];
      if (!links.length && !nodes.length) return 0;

      const engine = api.getEngine();
      const cm = engine.commandManager;
      const many = links.length + nodes.length > 1;
      if (many) cm.beginBatch();
      try {
        for (const l of links) await engine.removeLink(l.id);
        for (const n of nodes) await engine.removeNode(n.id);   // cascades its own edges
      } finally {
        if (many) await cm.endBatch('Delete Selection');
      }
      api.renderNow();
      return links.length + nodes.length;
    };
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Delete' && e.key !== 'Backspace') return;
      // `e.target` is not always an element: a key dispatched at `window` (which
      // is what a programmatic shortcut usually does) makes it the window, and
      // `Node.contains(window)` throws rather than returning false.
      const target = e.target instanceof Node ? e.target : null;
      if (target && document.getElementById('src').contains(target)) return;
      if (e.target.closest?.('input, textarea, select, .monaco-editor')) return;
      // The delete is async now (it goes through the command stack), so the
      // event has to be claimed up front rather than on its result: by the time
      // the promise settles the browser has long since dispatched the default.
      e.preventDefault();
      e.stopImmediatePropagation();
      void deleteSelection();
    }, true);

    const load = (key) => { ed.setValue(EXAMPLES[key]); renderText(ta.value); };
    sel.addEventListener('change', () => load(sel.value));
    document.getElementById('apply').addEventListener('click', () => renderText(ta.value));

    ctx.renderText = renderText;
    ctx.load = load;
    ctx.deleteSelection = deleteSelection;
    load('flowchart');
    await ctx.tick();
  },

  async assert(ctx) {
    // The gate checks the WORKING path (flowchart) + the safe-failure guarantee.
    const flow = ctx.renderText(EXAMPLES.flowchart);
    check(flow.diagram.getNodes().length === 5, `flowchart should render 5 nodes, got ${flow.diagram.getNodes().length}`);
    check(flow.diagram.getNode('Start')?.getMetadata('shape')?.fill === '#c8e6c9', 'the styled Start node should carry its fill');
    const seq = ctx.renderText(EXAMPLES.sequence);
    check(seq.unsupported === 'sequenceDiagram', 'an unsupported type must report itself, not blank silently');

    // ROUND TRIP: a canvas edit must reach the TEXT. Delete the `Check -->|no| Start`
    // back-edge and the line describing it has to leave the source — otherwise the
    // pane is a stale snapshot pretending to be the document.
    ctx.renderText(EXAMPLES.flowchart);
    const ta = document.getElementById('text');
    const BACK = /Check\s*-->\|no\|\s*Start/;
    const FWD = /Check\s*-->\|yes\|\s*Save/;
    check(BACK.test(ta.value), 'the loaded source should carry the labelled back-edge');

    // Delete a node on the canvas. EVERY check below reads the text AFTER that,
    // because only then is the pane holding REGENERATED source rather than the
    // example text it was loaded with — an assertion made before the edit passes
    // no matter how lossy the export is.
    const m = ctx.instance.getModel();
    m.getNode('Done')?.setSelected?.(true);
    check((await ctx.deleteSelection()) === 1, 'deleting the selected node should remove exactly one entity');
    check(!/Done/.test(ta.value), 'the deleted node must disappear from the Mermaid source');
    check(!/Save\s*-->\s*Done/.test(ta.value), 'its edge must go with it');

    // A round trip must not DEGRADE what survives. Both of these failed while the
    // canvas still looked perfect: shapes came back as plain rectangles and every
    // `style` line vanished, because the old render projection never carried
    // `dslShape` / `dslStyled`.
    check(/Start\(\[Start\]\)/.test(ta.value), 'the stadium shape must survive the round trip, not flatten to Start[Start]');
    check(/Check\{Valid\?\}/.test(ta.value), 'the decision diamond must survive the round trip');
    check(/Load\[\(Fetch data\)\]/.test(ta.value), 'the cylinder shape must survive the round trip');
    check(/style Start fill:#c8e6c9/.test(ta.value), 'the style line must survive the round trip');
    check(BACK.test(ta.value) && FWD.test(ta.value), 'both edge labels must survive the round trip');

    ctx.renderText(EXAMPLES.flowchart); // leave it on the working example
  },
});
</script>
