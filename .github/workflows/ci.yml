name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  units:
    name: Unit batteries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # renderer-demo is excluded: it carries 18 documented pre-existing
      # failures that predate the extraction (see project memory / ROADMAP).
      # --parallel=1 on purpose: the perf-budget specs flake under contention.
      - run: npx nx run-many -t test --all --exclude=renderer-demo-renderer-demo --parallel=1
        env:
          NX_DAEMON: 'false'

  gates:
    name: Demo gates (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # poppler-utils provides pdftoppm — the export gates PIXEL-verify PDFs,
      # and must keep doing so on CI.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node demos/build.mjs
      # visual-run and export-pdf-run are LOCAL-ONLY for now: goldens are
      # per-platform (font rasterization differs), and the blessed set is
      # macOS. Blessing a Linux golden set in CI is tracked in ROADMAP.md.
      - run: node demos/e2e/gallery-run.mjs
      # The packaging covenant: what a consumer INSTALLS still works after their
      # bundler has finished with it. Every other gate here tests source — which
      # is why `sideEffects: false` was able to let three bundlers strip the
      # renderer's shape registration, degrading 13 shape types to plain
      # rectangles in every published build, with the whole suite green.
      - run: node demos/e2e/packaging-run.mjs
      # The framework-variant covenant: each host app builds and every route
      # paints, or the claim "this demo runs in <framework>" must not ship.
      - run: npx nx build demos-angular
      - run: node demos/e2e/variant-run.mjs angular
      - run: node apps/demos-react/build.mjs
      - run: node demos/e2e/variant-run.mjs react
      - run: node apps/demos-vue/build.mjs
      - run: node demos/e2e/variant-run.mjs vue
      - run: node demos/e2e/interaction-run.mjs
      - run: node demos/e2e/table-editing-run.mjs
      # The master-sheet covenant: every stencil master placed and measured as
      # PAINTED — ink present and inside its declared bounds, caption visible,
      # unclipped and untruncated (inside the silhouette or fully below it).
      # A master that renders garbage fails the user in the first minute.
      - run: node demos/e2e/master-sheet-run.mjs
      # The query-builder demo's own gestures: guided wiring (validator-aware
      # tints), pill-typed joins, the SQL that writes itself.
      - run: node demos/e2e/query-builder-run.mjs
      # The Visio-editor covenant: every advertised gesture (marquee, nudge,
      # duplicate, F2/type-to-replace, context menu, port-drag connect,
      # drag-into-container, edge-label edit, palette ghost, toolbar) driven
      # as a REAL pointer/keyboard gesture — a direct API call proving a broken
      # drag is exactly the failure this gate exists to prevent.
      - run: node demos/e2e/visio-editor-run.mjs
      # The Mermaid compatibility claim, checked against REAL mermaid v11 in both
      # directions. The site says this runs in CI; this is the line that makes
      # that true.
      - run: node demos/e2e/mermaid-oracle-run.mjs
      - run: node demos/e2e/save-load-run.mjs
      # The dashboard covenant: 30 board scenarios driven by a real mouse. This
      # file called itself "the gate" for months while nothing — not CI, not nx,
      # not a package script — ever ran it.
      - run: node demos/e2e/dashboard-scenarios-run.mjs
      - run: node demos/e2e/export-widgets-run.mjs
      - run: node demos/e2e/export-fetch-run.mjs
      - run: node demos/e2e/export-tree-images-run.mjs
